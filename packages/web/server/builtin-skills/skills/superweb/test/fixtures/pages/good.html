<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperWeb inspection fixture</title>
    <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />
    <style>
      :root {
        color-scheme: light;
        --ink: #17191b;
        --paper: #f7f6f2;
        --line: #d9d6cc;
        --accent: #b23a2b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      .shell { max-width: 1120px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 56px) 72px; }
      header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
      .wordmark { font-weight: 700; letter-spacing: 0.02em; }
      nav { display: flex; gap: 16px; }
      nav a { color: inherit; text-underline-offset: 4px; }
      .hero { display: grid; gap: 32px; padding: 64px 0 48px; grid-template-columns: 1.4fr 1fr; align-items: end; }
      h1 { font-size: clamp(36px, 6vw, 76px); line-height: 1.02; margin: 0; letter-spacing: -0.03em; }
      p { margin: 0; max-width: 46ch; }
      .button { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; background: var(--ink); color: var(--paper); text-decoration: none; border: 0; font: inherit; cursor: pointer; }
      .button:hover { background: var(--accent); }
      .button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      figure { margin: 0; border: 1px solid var(--line); background: #fff; padding: 12px; }
      figure img { display: block; width: 100%; height: auto; }
      .facts { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 48px; grid-template-columns: repeat(3, 1fr); }
      .facts div { background: var(--paper); padding: 20px; }
      .facts strong { display: block; font-size: 24px; }
      @media (max-width: 820px) {
        .hero { grid-template-columns: 1fr; padding-top: 40px; }
        .facts { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <span class="wordmark">FIELD NOTES</span>
        <nav aria-label="主导航">
          <a href="#work">作品</a>
          <a href="#about">关于</a>
        </nav>
      </header>
      <main>
        <section class="hero">
          <div>
            <h1>为一间小书店做一张能读的网页。</h1>
            <p style="margin-top: 24px">真实内容、克制的配色、清楚的行动。这个页面只用于验收测试，不包含外部资源。</p>
            <p style="margin-top: 24px"><button class="button" type="button">查看本周活动</button></p>
          </div>
          <figure>
            <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="占位图" width="1" height="1" />
            <figcaption style="font-size: 13px; color: #5f5b52; margin-top: 8px">占位图：等待真实照片。</figcaption>
          </figure>
        </section>
        <section class="facts" id="work" aria-label="书店信息">
          <div><strong>1978</strong>开店年份</div>
          <div><strong>周二至周日</strong>营业时间</div>
          <div><strong>42 平方米</strong>店面面积</div>
        </section>
      </main>
    </div>
  </body>
</html>
