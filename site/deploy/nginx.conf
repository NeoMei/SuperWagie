# SuperWagie static site. Replace /var/www/superwagie if you deploy elsewhere.
# After DNS points at this server run:
#   sudo certbot --nginx -d www.superwagie.com -d superwagie.com
# Certbot will add the 443 blocks and the HTTP -> HTTPS redirects.

server {
    listen 80;
    listen [::]:80;
    server_name www.superwagie.com;

    root /var/www/superwagie;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name superwagie.com;
    return 301 https://www.superwagie.com$request_uri;
}
