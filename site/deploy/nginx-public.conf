# Current public SuperWagie site on 47.108.85.222.
# Installed as /etc/nginx/conf.d/superwagie-preview.conf for continuity.
# Keep this host indexable while superwagie.com awaits ICP approval.
server {
    listen 80;
    listen [::]:80;
    server_name superwagie.quukk.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name superwagie.quukk.com;

    ssl_certificate     /etc/nginx/ssl/_.quukk.com_chain.pem;
    ssl_certificate_key /etc/nginx/ssl/_.quukk.com_key.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;

    root /var/www/superwagie;
    index index.html;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Installers stay on 113; the public server holds the static pages.
    location /downloads/ {
        proxy_pass https://113.249.120.24:8444/downloads/;
        proxy_ssl_server_name on;
        proxy_ssl_name www.superwagie.com;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host www.superwagie.com;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
