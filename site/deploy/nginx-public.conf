# Public SuperWagie site on 47.108.85.222.
# Install as conf.d/superwagie.conf and remove the superseded
# conf.d/superwagie-preview.conf from Nginx's include directory.
server {
    listen 80;
    listen [::]:80;
    server_name www.superwagie.com superwagie.com;
    return 301 https://www.superwagie.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name superwagie.com;

    ssl_certificate     /etc/nginx/ssl/superwagie.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/superwagie.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.superwagie.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.superwagie.com;

    ssl_certificate     /etc/nginx/ssl/superwagie.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/superwagie.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SuperWagieTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;

    root /var/www/superwagie;
    index index.html;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Installers stay on 113; the public server serves the static pages.
    location /downloads/ {
        proxy_pass https://113.249.120.24:8444/downloads/;
        proxy_ssl_server_name on;
        proxy_ssl_name www.superwagie.com;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host www.superwagie.com;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Keep the previous origin available while the provider still blocks some
# connections to superwagie.com. Page canonicals point to the official origin.
# Replace this compatibility site with redirects once public HTTP and TLS 1.2
# work; see site/README.md. Preserve Google ownership files during that change.
server {
    listen 80;
    listen [::]:80;
    server_name superwagie.quukk.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name superwagie.quukk.com;

    ssl_certificate     /etc/nginx/ssl/_.quukk.com_chain.pem;
    ssl_certificate_key /etc/nginx/ssl/_.quukk.com_key.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;

    root /var/www/superwagie;
    index index.html;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Installers stay on 113; the public server holds the static pages.
    location /downloads/ {
        proxy_pass https://113.249.120.24:8444/downloads/;
        proxy_ssl_server_name on;
        proxy_ssl_name www.superwagie.com;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host www.superwagie.com;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
