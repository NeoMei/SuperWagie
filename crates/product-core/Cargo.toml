[package]
name = "superwagie-product-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "superwagie_product_core"
path = "src/lib.rs"

[[bin]]
name = "superwagie-product-core"
path = "src/main.rs"

[dependencies]
hex = "=0.4.3"
hmac = "=0.12.1"
libc = "=0.2.175"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
