<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OpenChamber animation cost fixture</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 12px ui-monospace, monospace; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  .cell { width: 24px; height: 24px; }
  svg { width: 24px; height: 24px; display: block; }
  .wrap { display: block; width: 24px; height: 24px; }

  /*
    One variant per animated property, so a run answers "what does animating
    this cost" rather than "is this particular component slow". Compositor-
    driven properties should cost a small constant; anything the compositor
    cannot handle recalculates style every frame.
  */
  @keyframes oc-transform-rotate { to { transform: rotate(360deg); } }
  @keyframes oc-transform-stepped { to { transform: rotate(360deg); } }
  @keyframes oc-rotate-property { to { rotate: 360deg; } }
  @keyframes oc-opacity { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  @keyframes oc-translate { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @keyframes oc-scale { 0%, 100% { transform: scale(0.7); } 50% { transform: scale(1); } }
  @keyframes oc-background-position { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @keyframes oc-border-color { 0%, 100% { border-color: #345; } 50% { border-color: #8ab; } }
  @keyframes oc-box-shadow { 0%, 100% { box-shadow: 0 0 0 0 #8ab; } 50% { box-shadow: 0 0 8px 2px #8ab; } }
  @keyframes oc-filter { 0%, 100% { filter: brightness(0.6); } 50% { filter: brightness(1.4); } }
  @keyframes oc-width { 0%, 100% { width: 12px; } 50% { width: 24px; } }

  .v-none svg { animation: none; }
  .v-transform-rotate svg { animation: oc-transform-rotate 1s linear infinite; }
  .v-transform-rotate-willchange svg { animation: oc-transform-rotate 1s linear infinite; will-change: transform; }
  .v-transform-rotate-steps svg { animation: oc-transform-rotate 1s steps(12) infinite; }
  .v-transform-stepped svg { animation: oc-transform-stepped 1.5s steps(30) infinite; }
  .v-transform-rotate-wrapper .wrap { animation: oc-transform-rotate 1s linear infinite; }
  .v-rotate-property svg { animation: oc-rotate-property 1s linear infinite; }
  .v-opacity svg { animation: oc-opacity 1.2s ease-in-out infinite; }
  .v-translate svg { animation: oc-translate 1.2s ease-in-out infinite; }
  .v-scale svg { animation: oc-scale 1.2s ease-in-out infinite; }
  .v-background-position .cell {
    background-color: #223;
    background-image: linear-gradient(90deg, #223, #8ab, #223);
    background-repeat: no-repeat;
    background-position: 100% 0;
    background-size: 200% 100%;
    animation: oc-background-position 1.5s linear infinite;
  }
  .v-border-color .cell { border: 2px solid #345; animation: oc-border-color 1.5s linear infinite; }
  .v-box-shadow .cell { animation: oc-box-shadow 1.5s linear infinite; }
  .v-filter svg { animation: oc-filter 1.5s linear infinite; }
  .v-width svg { animation: oc-width 1.5s linear infinite; }

  /*
    Context variants. The same composited animation can stop being composited
    because of an ancestor, so these reproduce the surroundings a spinner
    actually lives in. Each keeps the identical transform animation and varies
    only the context.
  */
  .v-ctx-button .cell svg,
  .v-ctx-filter .cell svg,
  .v-ctx-overflow .cell svg,
  .v-ctx-backdrop .cell svg,
  .v-ctx-opacity .cell svg,
  .v-ctx-transformed-parent .cell svg,
  .v-ctx-sibling-translatez .cell svg,
  .v-ctx-currentcolor .cell svg { animation: oc-transform-rotate 1s linear infinite; }

  /* Mirrors the repository rule that gives every other button SVG a GPU hint. */
  .v-ctx-sibling-translatez button svg:not(.spin) { transform: translateZ(0); }

  .v-ctx-filter .cell { filter: brightness(1.05); }
  .v-ctx-overflow .cell { overflow: hidden; }
  .v-ctx-backdrop .cell { backdrop-filter: blur(2px); }
  .v-ctx-opacity .cell { opacity: 0.9; }
  .v-ctx-transformed-parent .cell { transform: translateY(1px); }
  .v-ctx-currentcolor .cell { color: color-mix(in srgb, #8ab 60%, #345); }
  .v-ctx-currentcolor .cell svg { stroke: currentColor; }

  /*
    The repository's own spinner rules, isolated. The application overrides
    Tailwind's animate-spin with these, so each piece is measured separately to
    find which one stops the rotation being composited.
  */
  @keyframes oc-webkit-spin {
    0% { transform: translateZ(0) rotate(0deg); }
    100% { transform: translateZ(0) rotate(360deg); }
  }
  .v-app-keyframes svg { animation: oc-webkit-spin 1s linear infinite; }
  .v-app-fillbox svg {
    animation: oc-transform-rotate 1s linear infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }
  .v-app-full svg {
    animation: oc-webkit-spin 1s linear infinite;
    will-change: transform;
    transform-box: fill-box;
    transform-origin: 50% 50%;
    overflow: visible;
    display: block;
  }

  /*
    The chat status row's busy indicator, reproduced exactly: three text dots
    as flex items of an inline-flex span, pulsing opacity with staggered
    delays. It is on screen for the whole of every streamed response, so its
    per-second cost is paid for as long as the model is working. The remaining
    variants change one thing each to find which part makes it expensive.
  */
  @keyframes oc-busy-pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  .busy-dots { display: inline-flex; }
  .v-busy-dots-static .busy-dots span { opacity: 0.6; }
  .v-busy-dots .busy-dots span,
  .v-busy-dots-willchange .busy-dots span,
  .v-busy-dots-single .busy-dots { animation: oc-busy-pulse 1.2s ease-in-out infinite; }
  .v-busy-dots-willchange .busy-dots span { will-change: opacity; }
  .v-busy-dots-steps .busy-dots span { animation: oc-busy-pulse 1.2s steps(4, jump-none) infinite; }
  /*
    Three steps per half cycle make one step 200ms, the same as the stagger
    between dots, so all three dots change on the same frames: five distinct
    frames per second instead of one per dot per step.
  */
  .v-busy-dots-steps-aligned .busy-dots span { animation: oc-busy-pulse 1.2s steps(3, jump-none) infinite; }
  /* Compare the status pill's old dots with one filtered provider-logo image. */
  .v-status-logo-dots .cell,
  .v-status-logo-pulse .cell { width: auto; height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 9999px; background: #19191980; }
  .status-logo { width: 14px; height: 14px; margin-right: 6px; filter: brightness(0.9) contrast(1.1) invert(1); }
  .v-status-logo-dots .busy-dots span { animation: oc-busy-pulse 1.2s steps(3, jump-none) infinite; }
  @keyframes oc-status-logo { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  .v-status-logo-pulse .status-logo { animation: oc-status-logo 4s steps(10, jump-none) infinite; }
  @media (prefers-reduced-motion: reduce) {
    .v-status-logo-pulse .status-logo { animation: none; }
  }
  /*
    The same stepped wave with no animation object at all: a 200ms timer moves
    a phase attribute and plain rules map phase to opacity. Kept as a recorded
    negative result: it measured no cheaper than the aligned stepped animation
    (5.0-5.4% of a core against 4.7%), so five drawn frames a second cost the
    same whoever asks for them, and the timer adds style and layout work.
  */
  .v-busy-dots-timer .busy-dots span { opacity: 0.2; }
  .v-busy-dots-timer .busy-dots[data-phase="1"] span:nth-child(1),
  .v-busy-dots-timer .busy-dots[data-phase="2"] span:nth-child(2),
  .v-busy-dots-timer .busy-dots[data-phase="3"] span:nth-child(3),
  .v-busy-dots-timer .busy-dots[data-phase="4"] span:nth-child(1),
  .v-busy-dots-timer .busy-dots[data-phase="5"] span:nth-child(2),
  .v-busy-dots-timer .busy-dots[data-phase="0"] span:nth-child(3) { opacity: 0.6; }
  .v-busy-dots-timer .busy-dots[data-phase="2"] span:nth-child(1),
  .v-busy-dots-timer .busy-dots[data-phase="3"] span:nth-child(1),
  .v-busy-dots-timer .busy-dots[data-phase="3"] span:nth-child(2),
  .v-busy-dots-timer .busy-dots[data-phase="4"] span:nth-child(2),
  .v-busy-dots-timer .busy-dots[data-phase="4"] span:nth-child(3),
  .v-busy-dots-timer .busy-dots[data-phase="5"] span:nth-child(3) { opacity: 1; }

  /*
    A waiting indicator as the app draws it (`useWaitingBlink`): no animation,
    one shared 1 s timer toggles bright and dim on every indicator at once.
  */
  .v-blink-timer.dim svg { opacity: 0.4; }

  /*
    The composer caret. `caret-css` is CodeMirror's own `drawSelection()` rule
    on its cursor layer; `caret-timer` writes the same 1.2 s rhythm from a
    600 ms timer.
  */
  @keyframes cm-blink { 0% {} 50% { opacity: 0; } 100% {} }
  .caret { width: 1.2px; height: 16px; background: #eee; }
  .v-caret-css .caret { animation: steps(1) cm-blink 1.2s infinite; }
  .v-caret-timer.caret-off .caret { opacity: 0; }

  .v-activity-static, .v-activity-collapse, .v-activity-header-static, .v-activity-header-shimmer { display: block; }
  .v-activity-static .cell, .v-activity-collapse .cell { width: 680px; height: auto; overflow: hidden; }
  .activity-row { height: 18px; display: flex; gap: 12px; }

  /*
    The folded Activity header as the shared UI mounts it: a full-width ghost
    button with the real text fragments and a visually duplicated text layer.
    The static variant has the same DOM without animation. The shimmer variant
    copies the fixed-period gradient, clip, fill and 2.8 s infinite timing
    from index.css.
  */
  .v-activity-header-static .grid, .v-activity-header-shimmer .grid { display: block; padding: 8px; gap: 0; }
  .activity-header {
    --tools-icon: #949187;
    --tools-title: #dbd7cc;
    --tools-description: #949187;
    --text-ui-label: 0.84375rem;
    --text-meta: 0.78125rem;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.375rem;
    width: min(860px, calc(100vw - 16px));
    height: 28px;
    box-sizing: border-box;
    padding: 1px 8px 1px 1px;
    overflow: hidden;
    white-space: nowrap;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--tools-description);
    font: 500 var(--text-ui-label) / 1.45 system-ui, sans-serif;
    text-align: start;
  }
  .activity-header .header-icon { width: 14px; height: 14px; flex: none; color: var(--tools-icon); }
  .activity-header .header-arrow { width: 12px; height: 12px; flex: none; color: var(--tools-icon); }
  .activity-header .header-title { flex: none; font-weight: 600; color: var(--tools-title); }
  .activity-header .header-tool {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1 1 0%;
    min-width: 0;
    font-size: var(--text-meta);
  }
  .activity-header .header-tool-label { flex: none; font-weight: 500; color: var(--tools-title); }
  .activity-header .header-tool-command {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--font-mono);
    color: var(--tools-description);
  }
  .activity-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 0.375rem;
    box-sizing: border-box;
    overflow: hidden;
    padding-inline: 1px 0.5rem;
    pointer-events: none;
    color: var(--tools-title);
    background: linear-gradient(90deg,
      transparent 0 40%,
      color-mix(in srgb, currentColor 18%, transparent) 46%,
      color-mix(in srgb, currentColor 20%, white) 50%,
      color-mix(in srgb, currentColor 18%, transparent) 54%,
      transparent 60% 100%) -240px 0 / 240px 100% repeat-x;
    -webkit-background-clip: text;
    background-clip: text;
  }
  .activity-layer, .activity-layer * { -webkit-text-fill-color: transparent; }
  .activity-layer svg, .activity-layer [aria-hidden='true'] { visibility: hidden; }
  .v-activity-header-static .activity-layer { animation: none; }
  .v-activity-header-shimmer .activity-layer { animation: oc-live-header-shimmer 2.8s linear infinite; }
  /* One 240 px period of travel loops seamlessly. */
  @keyframes oc-live-header-shimmer { from { background-position: -240px 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) {
    .v-activity-header-shimmer .activity-layer { animation: none; display: none; }
  }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
  const SPINNER = '<svg viewBox="0 0 24 24" fill="none" stroke="#8ab" stroke-width="2">'
    + '<circle cx="12" cy="12" r="9" stroke-opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>';
  const HEADER_FRAGMENTS = '<svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">'
    + '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>'
    + '<span class="header-title">Execution details<span aria-hidden="true"> ...</span></span>'
    + '<svg class="header-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>'
    + '<span class="header-tool"><span class="header-tool-label">Shell Command</span>'
    + '<span class="header-tool-command" title="bun test packages/ui/src/components/chat/components/LiveTurnActivity.test.tsx">'
    + 'bun test packages/ui/src/components/chat/components/LiveTurnActivity.test.tsx</span></span>';
  const params = new URLSearchParams(location.search);
  // Style recalculation cost depends on how much document there is to walk, so
  // a variant that is free on a small page is not proven free in a real one.
  const filler = Math.max(0, Number(params.get('filler') || 0));
  const variant = params.get('variant') || 'none';
  const count = Math.max(1, Number(params.get('count') || 2));
  const grid = document.getElementById('grid');
  grid.className = 'grid v-' + variant;
  const usesActivityHeader = variant === 'activity-header-static' || variant === 'activity-header-shimmer';
  const usesWrapper = variant.endsWith('-wrapper');
  const usesButton = variant === 'ctx-button' || variant === 'ctx-sibling-translatez';
  const usesActivity = variant === 'activity-static' || variant === 'activity-collapse';
  const usesBusyDots = variant.startsWith('busy-dots');
  const usesStatusLogo = variant.startsWith('status-logo-');
  for (let index = 0; index < count; index += 1) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const spinner = SPINNER.replace('<svg', '<svg class="spin"');
    if (usesActivityHeader) {
      const button = document.createElement('button');
      button.className = 'activity-header';
      button.type = 'button';
      button.setAttribute('aria-expanded', 'false');
      button.innerHTML = HEADER_FRAGMENTS;
      if (variant === 'activity-header-shimmer') {
        const layer = document.createElement('span');
        layer.className = 'activity-layer';
        layer.setAttribute('aria-hidden', 'true');
        layer.innerHTML = HEADER_FRAGMENTS;
        button.appendChild(layer);
      }
      grid.appendChild(button);
    }
    else if (usesActivity) {
      cell.innerHTML = Array.from({ length: 80 }, (_, row) =>
        '<div class="activity-row"><span>Read file</span><code>src/module-' + row + '.ts</code><span>Completed</span></div>'
      ).join('');
    }
    else if (usesStatusLogo) {
      const logo = document.createElement('img');
      logo.className = 'status-logo';
      logo.alt = '';
      logo.src = 'data:image/svg+xml,' + encodeURIComponent(SPINNER.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"'));
      cell.append(logo, 'GPT-6 Astra is working');
      if (variant === 'status-logo-dots') {
        const dots = document.createElement('span');
        dots.className = 'busy-dots';
        dots.innerHTML = [0, 200, 400].map((delay) => '<span style="animation-delay:' + delay + 'ms">.</span>').join('');
        cell.append('\u00A0', dots);
      }
    }
    else if (usesBusyDots) {
      cell.style.width = 'auto';
      cell.innerHTML = '<span>Working\u00A0<span class="busy-dots" aria-hidden="true">'
        + [0, 200, 400].map((delay) => '<span style="animation-delay:' + delay + 'ms">.</span>').join('')
        + '</span></span>';
    }
    else if (variant.startsWith('caret-')) cell.innerHTML = '<div class="caret"></div>';
    else if (usesWrapper) cell.innerHTML = '<span class="wrap">' + SPINNER + '</span>';
    else if (usesButton) cell.innerHTML = '<button>' + spinner + '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#456"/></svg></button>';
    else cell.innerHTML = SPINNER;
    grid.appendChild(cell);
  }

  // Two content regions per turn at most: prior messages and non-text parts
  // of the final message. Exercise the same 180ms height transition, with no
  // continuous animation between disclosure changes. The static variant has
  // identical content for the baseline.
  if (variant === 'activity-collapse') {
    let expanded = true;
    setInterval(() => {
      for (const cell of grid.children) {
        const height = cell.scrollHeight;
        cell.animate({ height: expanded ? [height + 'px', '0px'] : ['0px', height + 'px'] }, {
          duration: 180, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards',
        });
      }
      expanded = !expanded;
    }, 2000);
  }

  if (variant === 'busy-dots-timer') {
    let phase = 0;
    setInterval(() => {
      phase = (phase + 1) % 6;
      for (const dots of grid.querySelectorAll('.busy-dots')) dots.dataset.phase = String(phase);
    }, 200);
  }

  if (variant === 'blink-timer') setInterval(() => grid.classList.toggle('dim'), 1000);
  if (variant === 'caret-timer') setInterval(() => grid.classList.toggle('caret-off'), 600);

  if (filler > 0) {
    const container = document.createElement('div');
    container.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;';
    let markup = '';
    for (let index = 0; index < filler; index += 1) {
      markup += '<div class="filler-row"><span>row ' + index + '</span><em>x</em></div>';
    }
    container.innerHTML = markup;
    document.body.appendChild(container);
  }
</script>
</body>
</html>
