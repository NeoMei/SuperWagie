name: Repair 2.7.33 release assets (temporary)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref for the manifest script
        required: true
        type: string
      release_tag:
        description: Existing draft release tag
        required: true
        type: string
      windows_run_id:
        description: Successful Windows build run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Download the exact published macOS assets and Windows CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "SuperWagie-${RELEASE_TAG#v}-mac-arm64.dmg" \
            --pattern "SuperWagie-${RELEASE_TAG#v}-mac-arm64.zip" \
            --dir "$RUNNER_TEMP/release-assets"
          gh run download "$WINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name windows-x64 \
            --dir "$RUNNER_TEMP/release-assets"
          test -s "$RUNNER_TEMP/release-assets/SuperWagie-${RELEASE_TAG#v}-mac-arm64.dmg"
          test -s "$RUNNER_TEMP/release-assets/SuperWagie-${RELEASE_TAG#v}-mac-arm64.zip"
          test -s "$RUNNER_TEMP/release-assets/SuperWagie-${RELEASE_TAG#v}-win-x64.exe"

      - name: Rebuild release manifests from the actual uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          node scripts/release-manifests.mjs \
            --version "${RELEASE_TAG#v}" \
            --dist "$RUNNER_TEMP/release-assets" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --out "$RUNNER_TEMP/release-assets"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum SuperWagie-${RELEASE_TAG#v}-*) > "$RUNNER_TEMP/release-assets/SHA256SUMS"
          cp "$RUNNER_TEMP/release-assets/SHA256SUMS" "$RUNNER_TEMP/release-assets/mac.sha256"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';

          const dir = process.env.RUNNER_TEMP + '/release-assets';
          const version = process.env.RELEASE_TAG.slice(1);
          const names = [
            `SuperWagie-${version}-mac-arm64.dmg`,
            `SuperWagie-${version}-mac-arm64.zip`,
            `SuperWagie-${version}-win-x64.exe`,
          ];
          const artifacts = names.map((name) => {
            const file = path.join(dir, name);
            const bytes = fs.readFileSync(file);
            return { name, size: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex') };
          });
          fs.writeFileSync(path.join(dir, 'build-info.json'), `${JSON.stringify({
            version,
            sourceRevision: process.env.GITHUB_SHA,
            workflowRun: Number(process.env.WINDOWS_RUN_ID),
            artifacts,
            macOS: { notarized: false, source: 'GitHub macOS runner' },
            windows: { signed: false, source: 'GitHub Windows runner' },
          }, null, 2)}\n`);
          NODE

      - name: Upload the repaired Windows asset and manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-assets/SuperWagie-${RELEASE_TAG#v}-win-x64.exe" \
            "$RUNNER_TEMP/release-assets/latest.json" \
            "$RUNNER_TEMP/release-assets/latest-x64.yml" \
            "$RUNNER_TEMP/release-assets/latest.yml" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS" \
            "$RUNNER_TEMP/release-assets/mac.sha256" \
            "$RUNNER_TEMP/release-assets/build-info.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
