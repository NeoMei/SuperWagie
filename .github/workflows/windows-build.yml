name: Validate the existing Windows x64 installer

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-existing-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      APPLICATION_COMMIT: 106683b884902fbee1eb994791fdeb541ae47925
      APPLICATION_TREE: 93616ee6aa480a8b6993606736dbc3b8ea94ee86
      APPLICATION_ASAR: 6cb1f587cb922b548b8040625de37aa12e13b942b5d078d15fa37772425bcfac
      BUILD_RUN: '44385541364'
      ARTIFACT_ID: '14467342425'
      ARTIFACT_SHA256: 42ed84eae92110da161109451463498d55d67c794797b2e1c68cb7f489dfca57
      RUNTIME_PROBE_SHA256: 5030f804954a6594c80bb2df2452d9dcbea7d2d812d1bed52766a0b4902ea943
    steps:
      - name: Checkout immutable application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APPLICATION_COMMIT }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies for the frozen runtime probe
        run: bun install --frozen-lockfile

      - name: Download and verify the original artifact archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createReadStream, createWriteStream } from 'node:fs';
          import { mkdir, stat, writeFile } from 'node:fs/promises';
          import { pipeline } from 'node:stream/promises';
          const { GITHUB_REPOSITORY, GITHUB_API_URL, APPLICATION_COMMIT, BUILD_RUN, ARTIFACT_ID, ARTIFACT_SHA256, GH_TOKEN } = process.env;
          const artifactUrl = GITHUB_API_URL + '/repos/' + GITHUB_REPOSITORY + '/actions/artifacts/' + ARTIFACT_ID;
          const headers = { Authorization: 'Bearer ' + GH_TOKEN, Accept: 'application/vnd.github+json' };
          const metadataResponse = await fetch(artifactUrl, { headers });
          assert.equal(metadataResponse.status, 200, 'Artifact metadata is unavailable');
          const metadata = await metadataResponse.json();
          assert.equal(String(metadata.id), ARTIFACT_ID);
          assert.equal(metadata.name, 'windows-x64');
          assert.equal(metadata.expired, false);
          assert.equal(String(metadata.workflow_run.id), BUILD_RUN);
          assert.equal(metadata.workflow_run.head_sha, APPLICATION_COMMIT);
          assert.equal(metadata.digest, 'sha256:' + ARTIFACT_SHA256);
          assert.ok(metadata.size_in_bytes > 0 && metadata.size_in_bytes < 600_000_000);
          const redirect = await fetch(artifactUrl + '/zip', { headers, redirect: 'manual' });
          assert.equal(redirect.status, 302, 'Artifact archive redirect is unavailable');
          const downloadUrl = new URL(redirect.headers.get('location'));
          assert.equal(downloadUrl.protocol, 'https:');
          const download = await fetch(downloadUrl, { redirect: 'error', signal: AbortSignal.timeout(300_000) }).catch(() => null);
          assert.equal(download?.status, 200, 'Artifact archive download failed');
          await mkdir('.qa/receipts', { recursive: true });
          const archive = '.qa/installer.zip';
          await pipeline(download.body, createWriteStream(archive));
          assert.equal((await stat(archive)).size, metadata.size_in_bytes);
          const hash = createHash('sha256');
          for await (const chunk of createReadStream(archive)) hash.update(chunk);
          assert.equal(hash.digest('hex'), ARTIFACT_SHA256);
          await writeFile('.qa/receipts/archive.json', JSON.stringify({
            sourceRun: Number(BUILD_RUN), artifactId: Number(ARTIFACT_ID),
            artifactSha256: ARTIFACT_SHA256, archiveBytes: metadata.size_in_bytes
          }) + '\n');
          NODE

      - name: Install the exact NSIS package and verify its runtime bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:APPLICATION_COMMIT) { throw 'Application checkout differs' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:APPLICATION_TREE) { throw 'Application tree differs' }
          $probe = 'packages/electron/scripts/smoke-packaged-runtime.mjs'
          if ((Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RUNTIME_PROBE_SHA256) { throw 'Source probe differs' }
          Expand-Archive -LiteralPath .qa/installer.zip -DestinationPath .qa/payload
          $installer = Get-Item -LiteralPath .qa/payload/SuperWagie-2.7.121-win-x64.exe
          $installRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '.qa/install'))
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installRoot" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer exit code $($installed.ExitCode)" }
          $asar = Join-Path $installRoot 'resources/app.asar'
          if ((Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:APPLICATION_ASAR) { throw 'Installed asar differs from build receipt' }
          $product = (Get-Content -LiteralPath packages/electron/package.json -Raw | ConvertFrom-Json).build.productName
          $application = Join-Path $installRoot ($product + '.exe')
          if (!(Test-Path -LiteralPath $application -PathType Leaf)) { throw 'Installed executable missing' }
          $stream = [System.IO.File]::OpenRead($application)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $stream.Position = $reader.ReadUInt32()
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) { throw 'Installed executable is not Windows x64' }
          } finally { $stream.Dispose() }
          $origin = Join-Path $installRoot 'resources/product-model-origin.json'
          [ordered]@{
            applicationCommit = $env:APPLICATION_COMMIT
            applicationTree = $env:APPLICATION_TREE
            probeSha256 = $env:RUNTIME_PROBE_SHA256
            installerSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            installerExit = $installed.ExitCode
            applicationAsarSha256 = $env:APPLICATION_ASAR
            productProxyOriginPresent = (Test-Path -LiteralPath $origin -PathType Leaf)
            architecture = 'x64'
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM .qa/receipts/installation.json
          "QA_APPLICATION=$application" | Add-Content -Encoding utf8 $env:GITHUB_ENV

      - name: Run the original native smoke against the installed product
        shell: pwsh
        timeout-minutes: 6
        run: |
          node packages/electron/scripts/smoke-packaged-runtime.mjs --app $env:QA_APPLICATION --receipt .qa/receipts/runtime.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime smoke failed' }

      - name: Upload immutable artifact and native smoke receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-installed-qa
          path: .qa/receipts/*.json
          include-hidden-files: true
          if-no-files-found: warn
