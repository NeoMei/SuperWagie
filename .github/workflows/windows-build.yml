name: Build Windows installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: v2.7.1

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout diagnostics tests from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tests
          sparse-checkout: |
            packages/electron/scripts/collect-windows-diagnostics.test.mjs
            packages/electron/scripts/collect-windows-diagnostics-evidence.test.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Use current diagnostics tests with the frozen collector
        shell: powershell
        env:
          DIAGNOSTICS_TEST_REVISION: ${{ github.workflow_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the app candidate' }
          $collector = 'packages/electron/scripts/collect-windows-diagnostics.ps1'
          $collectorHash = (Get-FileHash $collector -Algorithm SHA256).Hash
          $testFiles = @(
            'packages/electron/scripts/collect-windows-diagnostics.test.mjs',
            'packages/electron/scripts/collect-windows-diagnostics-evidence.test.ps1'
          )
          "Diagnostics collector source: $candidateRevision; SHA-256: $collectorHash" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Diagnostics tests source: $env:DIAGNOSTICS_TEST_REVISION" | Add-Content $env:GITHUB_STEP_SUMMARY
          foreach ($file in $testFiles) {
            $source = Join-Path '.release-tests' $file
            $expectedHash = (Get-FileHash $source -Algorithm SHA256).Hash
            Copy-Item $source $file -Force
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $expectedHash) { throw "Test copy differs: $file" }
            "Test $file; SHA-256: $expectedHash" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          if ((Get-FileHash $collector -Algorithm SHA256).Hash -ne $collectorHash) { throw 'The frozen collector changed' }
          $changedFiles = @(git diff --name-only)
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the candidate diff' }
          foreach ($file in $changedFiles) {
            if ($testFiles -notcontains $file) { throw "Unexpected candidate change: $file" }
          }

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check SuperWagie customizations
        run: bun run test:customizations

      - name: Test diagnostics with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'Diagnostics compatibility tests require Windows PowerShell 5.1'
          }
          # Child powershell.exe must load its own modules, not ones inherited from pwsh.
          $env:SUPERWAGIE_TEST_POWERSHELL = Join-Path $PSHOME 'powershell.exe'
          $env:PSModulePath = Join-Path $PSHOME 'Modules'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          Import-Module Microsoft.PowerShell.Archive
          $archiveModule = (Get-Module Microsoft.PowerShell.Archive).Path
          if (-not $archiveModule.StartsWith($env:PSModulePath, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Diagnostics tests loaded an Archive module from another PowerShell installation'
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion); Archive $archiveModule; Temp $env:TEMP"
          node --test packages/electron/scripts/collect-windows-diagnostics.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostics compatibility tests failed' }

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep

      - name: Prepare SuperWeb for the target architecture
        shell: pwsh
        env:
          npm_config_cpu: ${{ matrix.arch }}
          npm_config_os: win32
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location packages/web/server/builtin-skills/skills/superweb
          try {
            npm ci --omit=dev --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'SuperWeb dependency installation failed' }
          } finally { Pop-Location }
          Push-Location packages/electron
          try {
            bun run prepare:superweb
            if ($LASTEXITCODE -ne 0) { throw 'SuperWeb staging failed' }
          } finally { Pop-Location }

      - name: Restore the pinned Windows knowledge backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The source pin and Windows patch are unchanged from this complete release.
          $installer = Join-Path $env:RUNNER_TEMP 'SuperWagie-2.7.19-win-x64.exe'
          $extracted = Join-Path $env:RUNNER_TEMP 'superwagie-knowledge-2.7.19'
          Invoke-WebRequest 'https://github.com/NeoMei/SuperWagie-Open/releases/download/v2.7.19/SuperWagie-2.7.19-win-x64.exe' -OutFile $installer
          $installerHash = '88e3e3a4417b7f0833fc7a5a07b529993e53d8298793804f28eb10f3e29bc874'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $installerHash) {
            throw 'The pinned knowledge source installer checksum does not match'
          }
          # Select the embedded 7z payload; Windows 7-Zip otherwise opens the outer NSIS container.
          & 7z x -t7z $installer "-o$extracted" 'resources/embedded-knowledge/*' -r -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the pinned knowledge backend' }
          $source = Join-Path $extracted 'resources/embedded-knowledge'
          $manifest = Get-Content (Join-Path $source 'manifest.json') -Raw | ConvertFrom-Json
          $binaryHash = 'bed12a528363cccbab302db63d27f5e60d780faa08623ba94b6bd4560fc4c162'
          if ($manifest.commit -ne 'f5adb9eac166e7d3da7dceed7aa50049d4c4db1f' -or
              $manifest.binary -ne 'embedded-knowledge-server.exe' -or
              $manifest.binarySha256 -ne $binaryHash -or
              $manifest.windowsPatch.target -ne 'x86_64-pc-windows-gnu' -or
              $manifest.windowsPatch.sha256 -ne 'cd7d7a4a296acfe0ec5766b51682ff076e84f3938208823605f51e1e6f2ece71') {
            throw 'The pinned knowledge manifest does not match the expected backend'
          }
          if ((Get-FileHash (Join-Path $source $manifest.binary) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $binaryHash) {
            throw 'The pinned knowledge binary checksum does not match'
          }
          $destination = 'packages/electron/resources/embedded-knowledge'
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          Copy-Item $source $destination -Recurse

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
          node ./scripts/windows-update-feeds.mjs ./dist

      - name: Verify packaged resources against staged files
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { matchesWindowsKnowledgePatch } from './packages/electron/scripts/embedded-knowledge-windows.mjs';

          const arch = process.env.OPENCHAMBER_TARGET_ARCH;
          const electronRoot = path.resolve('packages/electron');
          assert.equal(arch, 'x64', 'Windows desktop packages support x64 only');
          const resources = path.join(electronRoot, 'dist', 'win-unpacked', 'resources');
          const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const hash = async (file) => {
            const digest = createHash('sha256');
            for await (const chunk of fs.createReadStream(file)) digest.update(chunk);
            return digest.digest('hex');
          };
          const knowledgePath = path.join(resources, 'embedded-knowledge');
          const manifest = readJson(path.join(knowledgePath, 'manifest.json'));
          const stagedManifest = readJson(path.join(electronRoot, 'resources/embedded-knowledge/manifest.json'));
          assert.deepEqual(manifest, stagedManifest, 'Packaged knowledge manifest differs from the staged manifest');
          assert.equal(manifest.repository, 'https://github.com/NeoMei/embedded-knowledge');
          assert.equal(manifest.ref, 'embedded-knowledge');
          assert.equal(manifest.commit, 'f5adb9eac166e7d3da7dceed7aa50049d4c4db1f');
          assert.equal(manifest.tags, 'sqlite_fts5,anydoc');
          assert.equal(manifest.binary, 'embedded-knowledge-server.exe');
          assert.equal(manifest.binarySha256, 'bed12a528363cccbab302db63d27f5e60d780faa08623ba94b6bd4560fc4c162');
          assert.equal(await hash(path.join(knowledgePath, manifest.binary)), manifest.binarySha256);
          assert.ok(matchesWindowsKnowledgePatch(manifest, 'win32'), 'The source Windows patch changed; rebuild the backend');
          const preparation = fs.readFileSync(path.join(electronRoot, 'scripts/prepare-embedded-knowledge.mjs'), 'utf8');
          const pin = preparation.match(/const PINNED_COMMIT = .*?\?\? '([^']+)';/)?.[1];
          assert.ok(pin && manifest.commit.startsWith(pin), 'The source knowledge pin changed; rebuild the backend');
          for (const [constant, field] of [['REPO', 'repository'], ['REF', 'ref'], ['TAGS', 'tags']]) {
            const expected = preparation.match(new RegExp(`const ${constant} = .*?\\|\\| '([^']+)';`))?.[1];
            assert.equal(manifest[field], expected, `The source knowledge ${field} changed; rebuild the backend`);
          }

          for (const file of ['SKILL.md', 'package.json', 'bin/superweb.mjs', 'src/cli.ts', 'vendor/node_modules/tsx/package.json', 'vendor/node_modules/playwright-core/package.json', `vendor/node_modules/@esbuild/win32-${arch}/esbuild.exe`]) {
            assert.ok(fs.statSync(path.join(resources, 'superweb', file)).isFile(), `Missing SuperWeb resource: ${file}`);
          }
          const esbuild = fs.readFileSync(path.join(resources, 'superweb/vendor/node_modules/@esbuild', `win32-${arch}`, 'esbuild.exe'));
          assert.equal(esbuild.readUInt16LE(esbuild.readUInt32LE(0x3c) + 4), 0x8664, 'SuperWeb esbuild has the wrong architecture');

          const verified = [];
          const compareFiles = async (source, destination, label) => {
            for (const entry of fs.readdirSync(source, { withFileTypes: true })) {
              const staged = path.join(source, entry.name);
              const packaged = path.join(destination, entry.name);
              const name = `${label}/${entry.name}`;
              if (entry.isDirectory()) await compareFiles(staged, packaged, name);
              else {
                const sha256 = await hash(staged);
                assert.equal(await hash(packaged), sha256, `Packaged resource differs: ${name}`);
                verified.push({ path: name, sha256 });
              }
            }
          };
          for (const name of ['embedded-knowledge', 'superweb']) {
            await compareFiles(path.join(electronRoot, 'resources', name), path.join(resources, name), name);
          }
          for (const name of ['collect-windows-diagnostics.ps1', 'collect-windows-diagnostics.cmd']) {
            const sha256 = await hash(path.join(electronRoot, 'scripts', name));
            assert.equal(await hash(path.join(resources, 'windows-diagnostics', name)), sha256, `Packaged diagnostics differ: ${name}`);
            verified.push({ path: `windows-diagnostics/${name}`, sha256 });
          }
          const receipt = {
            appVersion: readJson(path.join(electronRoot, 'package.json')).version,
            appArchitecture: arch,
            knowledge: manifest,
            knowledgeArchitecture: 'x64',
            knowledgeCompatibility: 'Native x64',
            verifiedFiles: verified,
          };
          fs.writeFileSync(path.join(electronRoot, 'dist', `windows-${arch}-resources.json`), `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(`Verified ${verified.length} packaged resource files for ${arch}`);
          NODE

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/windows-*-resources.json
            packages/electron/dist/latest-x64.yml
            packages/electron/dist/latest.yml
