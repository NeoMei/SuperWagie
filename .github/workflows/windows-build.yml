name: Verify bundled and managed Windows x64 runtimes

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-existing-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [managed-update]
    env:
      QA_ENGINE_LANE: ${{ matrix.lane }}
      APPLICATION_COMMIT: 106683b884902fbee1eb994791fdeb541ae47925
      APPLICATION_TREE: 93616ee6aa480a8b6993606736dbc3b8ea94ee86
      APPLICATION_ASAR: 6cb1f587cb922b548b8040625de37aa12e13b942b5d078d15fa37772425bcfac
      BUILD_RUN: '44385541364'
      ARTIFACT_ID: '14467342425'
      ARTIFACT_SHA256: 42ed84eae92110da161109451463498d55d67c794797b2e1c68cb7f489dfca57
      RUNTIME_PROBE_SHA256: 5030f804954a6594c80bb2df2452d9dcbea7d2d812d1bed52766a0b4902ea943
    steps:
      - name: Checkout immutable application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.APPLICATION_COMMIT }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies for the frozen runtime probe
        run: bun install --frozen-lockfile

      - name: Download and verify the original artifact archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createReadStream, createWriteStream } from 'node:fs';
          import { mkdir, stat, writeFile } from 'node:fs/promises';
          import { pipeline } from 'node:stream/promises';
          const { GITHUB_REPOSITORY, GITHUB_API_URL, APPLICATION_COMMIT, BUILD_RUN, ARTIFACT_ID, ARTIFACT_SHA256, GH_TOKEN } = process.env;
          const artifactUrl = GITHUB_API_URL + '/repos/' + GITHUB_REPOSITORY + '/actions/artifacts/' + ARTIFACT_ID;
          const headers = { Authorization: 'Bearer ' + GH_TOKEN, Accept: 'application/vnd.github+json' };
          const metadataResponse = await fetch(artifactUrl, { headers });
          assert.equal(metadataResponse.status, 200, 'Artifact metadata is unavailable');
          const metadata = await metadataResponse.json();
          assert.equal(String(metadata.id), ARTIFACT_ID);
          assert.equal(metadata.name, 'windows-x64');
          assert.equal(metadata.expired, false);
          assert.equal(String(metadata.workflow_run.id), BUILD_RUN);
          assert.equal(metadata.workflow_run.head_sha, APPLICATION_COMMIT);
          assert.equal(metadata.digest, 'sha256:' + ARTIFACT_SHA256);
          assert.ok(metadata.size_in_bytes > 0 && metadata.size_in_bytes < 600_000_000);
          const redirect = await fetch(artifactUrl + '/zip', { headers, redirect: 'manual' });
          assert.equal(redirect.status, 302, 'Artifact archive redirect is unavailable');
          const downloadUrl = new URL(redirect.headers.get('location'));
          assert.equal(downloadUrl.protocol, 'https:');
          const download = await fetch(downloadUrl, { redirect: 'error', signal: AbortSignal.timeout(300_000) }).catch(() => null);
          assert.equal(download?.status, 200, 'Artifact archive download failed');
          await mkdir('.qa/receipts', { recursive: true });
          const archive = '.qa/installer.zip';
          await pipeline(download.body, createWriteStream(archive));
          assert.equal((await stat(archive)).size, metadata.size_in_bytes);
          const hash = createHash('sha256');
          for await (const chunk of createReadStream(archive)) hash.update(chunk);
          assert.equal(hash.digest('hex'), ARTIFACT_SHA256);
          await writeFile('.qa/receipts/archive.json', JSON.stringify({
            sourceRun: Number(BUILD_RUN), artifactId: Number(ARTIFACT_ID),
            artifactSha256: ARTIFACT_SHA256, archiveBytes: metadata.size_in_bytes
          }) + '\n');
          NODE

      - name: Install the exact NSIS package and verify its runtime bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:APPLICATION_COMMIT) { throw 'Application checkout differs' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -ne $env:APPLICATION_TREE) { throw 'Application tree differs' }
          $probe = 'packages/electron/scripts/smoke-packaged-runtime.mjs'
          if ((Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RUNTIME_PROBE_SHA256) { throw 'Source probe differs' }
          Expand-Archive -LiteralPath .qa/installer.zip -DestinationPath .qa/payload
          $installer = Get-Item -LiteralPath .qa/payload/SuperWagie-2.7.121-win-x64.exe
          $installRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '.qa/install'))
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installRoot" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer exit code $($installed.ExitCode)" }
          $asar = Join-Path $installRoot 'resources/app.asar'
          if ((Get-FileHash -LiteralPath $asar -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:APPLICATION_ASAR) { throw 'Installed asar differs from build receipt' }
          $product = (Get-Content -LiteralPath packages/electron/package.json -Raw | ConvertFrom-Json).build.productName
          $application = Join-Path $installRoot ($product + '.exe')
          if (!(Test-Path -LiteralPath $application -PathType Leaf)) { throw 'Installed executable missing' }
          $stream = [System.IO.File]::OpenRead($application)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $stream.Position = $reader.ReadUInt32()
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) { throw 'Installed executable is not Windows x64' }
          } finally { $stream.Dispose() }
          $origin = Join-Path $installRoot 'resources/product-model-origin.json'
          [ordered]@{
            applicationCommit = $env:APPLICATION_COMMIT
            applicationTree = $env:APPLICATION_TREE
            probeSha256 = $env:RUNTIME_PROBE_SHA256
            installerSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            installerExit = $installed.ExitCode
            applicationAsarSha256 = $env:APPLICATION_ASAR
            productProxyOriginPresent = (Test-Path -LiteralPath $origin -PathType Leaf)
            architecture = 'x64'
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM .qa/receipts/installation.json
          "QA_APPLICATION=$application" | Add-Content -Encoding utf8 $env:GITHUB_ENV


      - name: Prepare a test-only diagnostic overlay
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const script = 'packages/electron/scripts/smoke-packaged-runtime.mjs';
          let source = readFileSync(script, 'utf8');
          assert.equal(createHash('sha256').update(source).digest('hex'), process.env.RUNTIME_PROBE_SHA256);
          const replace = (before, after) => {
            assert.equal(source.split(before).length, 2);
            source = source.replace(before, () => after);
          };
          replace("import { spawn } from 'node:child_process';", "import { spawn, execFileSync } from 'node:child_process';");
          replace('readdirSync, writeFileSync', 'readdirSync, readFileSync, writeFileSync');
          replace("import { readPinnedOpenCodeCliVersion } from './opencode-cli-version.mjs';",
            "import { readPinnedOpenCodeCliVersion } from './opencode-cli-version.mjs';\nimport { isSupportedOpenCodeVersion } from '../../web/server/lib/opencode/compatibility.js';\nimport { compareOpenCodeVersions } from '../../web/server/lib/opencode/bundled-runtime.js';");
          replace("  writeFileSync(path.join(data, 'settings.json'), JSON.stringify({ desktopLocalPort:", String.raw`  const lane = process.env.QA_ENGINE_LANE;
            assert(['fixed-bundled', 'managed-update'].includes(lane));
            receipt.engineLane = lane;
            writeFileSync(path.join(data, 'settings.json'), JSON.stringify({ ...(lane === 'fixed-bundled' && { opencodeBinary: engine }), desktopLocalPort:`);
          replace("let seedChild, appChild, cdp, fixture;", String.raw`let seedChild, appChild, cdp, fixture;
          const safeVersion = (value) => typeof value === 'string' && /^v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]{1,48})?$/.test(value) ? value : null;
          const safeTransport = (error) => typeof error?.reason === 'string' && ['Transport', 'UnexpectedStatus', 'UnsupportedContentType', 'MalformedResponse'].includes(error.reason) ? error.reason : 'other';
          const installedEngineProcesses = (managedBinary = "") => {
            const script = [
              '$ProgressPreference = "SilentlyContinue"',
              '$rows = Get-CimInstance Win32_Process -Filter "Name = \'opencode.exe\'" | Select-Object -First 8 | ForEach-Object {',
              '$ports = @(Get-NetTCPConnection -OwningProcess $_.ProcessId -State Listen -ErrorAction SilentlyContinue | Select-Object -First 8 -ExpandProperty LocalPort)',
              '[ordered]@{ pid = $_.ProcessId; parentPid = $_.ParentProcessId; parentIsApp = ($_.ParentProcessId -eq [int]$env:QA_APP_PID); installedBinary = ($_.ExecutablePath -eq $env:QA_ENGINE); managedBinary = ($_.ExecutablePath -eq $env:QA_MANAGED_ENGINE); ports = $ports }',
              '}',
              'ConvertTo-Json -InputObject @($rows) -Compress -Depth 4',
            ].join('\n');
            try {
              const data = execFileSync('powershell.exe', ['-NoProfile', '-NonInteractive', '-EncodedCommand', Buffer.from(script, 'utf16le').toString('base64')], {
                env: { ...process.env, QA_APP_PID: String(appChild?.pid ?? 0), QA_ENGINE: engine, QA_MANAGED_ENGINE: managedBinary },
                stdio: ['ignore', 'pipe', 'ignore'], encoding: 'utf8', timeout: 8_000, maxBuffer: 16_384, windowsHide: true,
              });
              return { processes: JSON.parse(data) };
            } catch { return { snapshotUnavailable: true }; }
          };`);
          replace("const cdpFailureKind = (text) => /execution context.*destroyed/i.test(text) ? 'execution-context-destroyed'", "const cdpFailureKind = (text) => /CDP connection closed|WebSocket.*closed|WebSocket.*not open/i.test(text) ? 'connection-closed'\n    : /target.*closed|session.*closed|detached/i.test(text) ? 'target-detached'\n    : /got no reply/i.test(text) ? 'no-reply'\n    : /execution context.*destroyed/i.test(text) ? 'execution-context-destroyed'");

          replace("  const target = await until", "  let target = await until");
          replace("  const observedRendererEvaluation = async (expression) => {", String.raw`  const recoverableReadFailure = (kind) => ['connection-closed', 'target-detached', 'execution-context-destroyed', 'execution-context-not-found', 'runtime-auth-unavailable'].includes(kind);
            const reattachRendererRead = async () => until(async () => {
              if (stopped(appChild)) return null;
              const current = await findPageTarget(debugPort);
              if (!current.url.startsWith('openchamber-ui://app/') || current.url.includes('__splash')) return null;
              if (current.webSocketDebuggerUrl !== target.webSocketDebuggerUrl || cdp.socket.readyState !== WebSocket.OPEN) {
                cdp.close();
                target = current;
                cdp = new CdpClient(target.webSocketDebuggerUrl);
                await cdp.connect();
                cdp.on('Runtime.exceptionThrown', () => { rendererFailure = true; });
                cdp.on('Runtime.consoleAPICalled', event => {
                  if (event.args.some(argument => argument.value === 'Error caught by boundary:')) rendererFailure = true;
                });
                await cdp.send('Runtime.enable', {}, { timeoutMs: 10_000 });
                receipt.rendererReattachments = (receipt.rendererReattachments ?? 0) + 1;
              }
              return evaluateValue(cdp, "Boolean(window.__OPENCHAMBER_DESKTOP__ && (window.__OPENCHAMBER_CLIENT_TOKEN__ || window.__OPENCHAMBER_READ_RUNTIME_CONFIG__?.()?.clientToken) && !document.getElementById('initial-loading'))");
            }, 20_000);
            const observedRendererEvaluation = async (expression, readOnly = false) => {
              const retryTarget = readOnly && lane === 'managed-update';
              const observe = async () => {
                const evaluated = await cdp.send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true }, { timeoutMs: 15_000 });
                if (evaluated.exceptionDetails) {
                  const detail = evaluated.exceptionDetails;
                  const kind = cdpFailureKind(String(detail.text ?? '') + ' ' + String(detail.exception?.description ?? ''));
                  receipt.rendererEvaluationFailure = kind;
                  if (retryTarget && recoverableReadFailure(kind)) throw Object.assign(new Error('Retry detached renderer read'), { qaKind: kind });
                }
                return evaluated.result?.value;
              };
              try { return await observe(); }
              catch (error) {
                const kind = error.qaKind ?? cdpFailureKind(String(error?.message ?? error));
                receipt.rendererEvaluationFailure = kind;
                if (!retryTarget || !recoverableReadFailure(kind)) throw error;
                receipt.rendererReadRecovery = { stage: receipt.stage, failure: kind };
                await reattachRendererRead();
                return observe();
              }
            };
            const originalEvaluationUnused = async (expression) => {`);
          const obsoleteStart = source.indexOf('  const originalEvaluationUnused');
          const obsoleteEnd = source.indexOf('  let rendererFailure = false;', obsoleteStart);
          assert(0 <= obsoleteStart && obsoleteStart < obsoleteEnd);
          source = source.slice(0, obsoleteStart) + source.slice(obsoleteEnd);
          replace("contentType:response.headers.get('content-type')?.split(';')[0]??null,json}})()`);",
            "contentType:response.headers.get('content-type')?.split(';')[0]??null,json}})()`, !init.method || init.method === 'GET');");
          replace("    return new Response(result.status === 204", String.raw`    if (pathname === '/api/info' && result.status === 200) {
                const body = JSON.parse(result.text);
                const keys = ['version', 'status', 'healthy', 'ready', 'error', 'code', 'data', 'message'];
                (receipt.engineInfoObservations ??= []);
                if (receipt.engineInfoObservations.length < 16) receipt.engineInfoObservations.push({
                  contentType: receipt.lastRendererApi.contentType,
                  version: safeVersion(body?.version),
                  nestedVersion: safeVersion(body?.data?.version),
                  versionType: typeof body?.version,
                  knownFields: keys.filter((key) => body && Object.hasOwn(body, key)),
                  bodyIsArray: Array.isArray(body), bodyIsNull: body === null,
                });
              }
              return new Response(result.status === 204`);
          replace("  const info = await sdk.server.info();", String.raw`  const info = lane === 'fixed-bundled' ? await sdk.server.info() : await until(async () => {
              const response = await rendererFetch('/api/opencode/runtime-update');
              if (!response.ok) return null;
              const update = (await response.json()).runtimeUpdate;
              const status = ['idle', 'checking', 'downloading', 'installed', 'activating', 'current', 'failed'].includes(update?.status) ? update.status : 'other';
              const installedVersion = safeVersion(update?.installedVersion);
              receipt.managedUpdate = { status, installedVersion, restartRequired: update?.restartRequired === true };
              if (status !== 'current' || !installedVersion || update.restartRequired !== false) return null;
              const observed = await sdk.server.info();
              return observed.version === installedVersion && observed;
            }, 120_000);`);
          replace("  assert.equal(info.version, receipt.expectedEngineVersion);", String.raw`  if (lane === 'fixed-bundled') {
              assert.equal(info.version, receipt.expectedEngineVersion);
              receipt.engineProcessSnapshot = installedEngineProcesses();
              assert(receipt.engineProcessSnapshot.processes?.some((process) => process.parentIsApp && process.installedBinary && process.ports.length));
            } else {
              assert(isSupportedOpenCodeVersion(info.version));
              assert(compareOpenCodeVersions(info.version, receipt.expectedEngineVersion) > 0);
              assert.equal(info.version, receipt.managedUpdate.installedVersion);
              const managedDirectory = path.join(data, 'opencode-runtime', info.version + '-windows-x64-baseline');
              const manifest = JSON.parse(readFileSync(path.join(managedDirectory, 'manifest.json'), 'utf8'));
              assert.equal(manifest.version, info.version);
              assert.equal(manifest.platform, 'win32');
              assert.equal(manifest.arch, 'x64');
              assert.equal(manifest.binary, 'opencode.exe');
              assert.match(manifest.integrity, /^sha512-[A-Za-z0-9+/]+={0,2}$/);
              receipt.engineProcessSnapshot = installedEngineProcesses(path.join(managedDirectory, manifest.binary));
              assert(receipt.engineProcessSnapshot.processes?.some((process) => process.parentIsApp && process.managedBinary && process.ports.length));
              receipt.managedRuntimeVerified = true;
            }`);
          replace("    const created = await sdk.shell.create({ command", String.raw`    receipt.shellDiagnostics = { created: false, statusCounts: {}, pollErrors: {}, resultRead: false, cleanupCompleted: false };
              const created = await sdk.shell.create({ command`);
          replace("    try {\n      const shell = await until(async () => { const value = (await sdk.shell.get({ id: created.data.id, location: { directory: project } })).data; return value.status !== 'running' && value; }, 30_000);", String.raw`    receipt.shellDiagnostics.created = true;
              try {
                const shell = await until(async () => {
                  try {
                    const value = (await sdk.shell.get({ id: created.data.id, location: { directory: project } })).data;
                    const status = ['running', 'exited', 'killed', 'failed', 'spawnError'].includes(value.status) ? value.status : 'other';
                    receipt.shellDiagnostics.statusCounts[status] = (receipt.shellDiagnostics.statusCounts[status] ?? 0) + 1;
                    return value.status !== 'running' && value;
                  } catch (error) {
                    const kind = safeTransport(error);
                    receipt.shellDiagnostics.pollErrors[kind] = (receipt.shellDiagnostics.pollErrors[kind] ?? 0) + 1;
                    throw error;
                  }
                }, 30_000);`);
          replace("      const output = outputPage.output;", "      receipt.shellDiagnostics.resultRead = true;\n      const output = outputPage.output;");
          replace("    } finally { await sdk.shell.remove({ id: created.data.id, location: { directory: project } }); }", "    } finally { await sdk.shell.remove({ id: created.data.id, location: { directory: project } }); receipt.shellDiagnostics.cleanupCompleted = true; }");
          const target = 'packages/electron/scripts/.qa-windows-installed-runtime.mjs';
          writeFileSync(target, source);
          writeFileSync('.qa/receipts/diagnostic-probe.json', JSON.stringify({
            originalSha256: process.env.RUNTIME_PROBE_SHA256,
            diagnosticSha256: createHash('sha256').update(source).digest('hex'),
          }) + '\n');
          NODE
          node --check packages/electron/scripts/.qa-windows-installed-runtime.mjs

      - name: Run the diagnostic native smoke against the installed product
        shell: pwsh
        timeout-minutes: 6
        run: |
          node packages/electron/scripts/.qa-windows-installed-runtime.mjs --app $env:QA_APPLICATION --receipt .qa/receipts/runtime.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime smoke failed' }

      - name: Upload immutable artifact and native smoke receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-installed-${{ matrix.lane }}
          path: .qa/receipts/*.json
          include-hidden-files: true
          if-no-files-found: warn
