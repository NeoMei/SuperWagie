name: Desktop Release Build Smoke

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to checkout, for example openchamber/openchamber or daveotero/openchamber
        required: false
        default: openchamber/openchamber
        type: string
      ref:
        description: Git ref to build (branch, tag, or sha)
        required: true
        default: feat/windows-desktop-app
        type: string
      build_macos:
        description: Build signed/notarized macOS Electron artifacts
        required: false
        default: true
        type: boolean
      build_windows:
        description: Build Windows Electron installer artifacts
        required: false
        default: true
        type: boolean
      build_linux:
        description: Build Linux Electron AppImage artifacts
        required: false
        default: true
        type: boolean
      retention_days:
        description: Artifact retention days
        required: false
        default: "7"
        type: choice
        options:
          - "1"
          - "3"
          - "7"
          - "14"

permissions:
  contents: read

jobs:
  build-macos-electron:
    if: ${{ inputs.build_macos }}
    name: Build macOS Electron (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            platform: darwin-aarch64
            runner: blacksmith-6vcpu-macos-26
          - target: x86_64-apple-darwin
            arch: x64
            platform: darwin-x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Go for the knowledge backend
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'

      - name: Set up Rust for the knowledge backend
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.97.1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install Apple Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/electron-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Prepare native Hy resources
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bun run prepare:hy-memory -- --target=darwin-${{ matrix.arch }}
          node --input-type=module -e "import { verifyHyMemoryResources } from './scripts/prepare-hy-memory.mjs'; verifyHyMemoryResources('resources/hy-memory', { target: 'darwin-' + process.env.OPENCHAMBER_TARGET_ARCH });"

      - name: Build Electron app
        working-directory: packages/electron
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        run: |
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          rustup target add '${{ matrix.target }}'
          bun run prepare:embedded-knowledge
          bun run bundle:main
          # npmRebuild=false in package.json, so electron-builder won't
          # recompile native deps on its own. Rebuild against the target
          # Electron ABI before packaging, matching the release workflow.
          bun run rebuild:native
          bun run prepare:presentation
          bunx electron-builder --mac --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Verify signature + entitlements + notarization
        run: |
          set -euo pipefail

          APP_DIR="packages/electron/dist/mac"
          [ -d "packages/electron/dist/mac-arm64" ] && APP_DIR="packages/electron/dist/mac-arm64"

          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found under packages/electron/dist/mac*"
            ls -la packages/electron/dist/
            exit 1
          fi

          echo "Verifying $APP_PATH"
          codesign -vv --deep --strict "$APP_PATH"

          CS_INFO=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)
          echo "$CS_INFO"
          if ! echo "$CS_INFO" | grep -q "flags=.*runtime"; then
            echo "Error: hardened runtime flag missing"
            exit 1
          fi

          xcrun stapler validate "$APP_PATH"

          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP_PATH" 2>&1 || true)
          if echo "$ENTITLEMENTS" | grep -q "com.apple.security.app-sandbox"; then
            echo "Error: app sandbox entitlement is present"
            exit 1
          fi
          for key in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory \
            com.apple.security.cs.disable-library-validation
          do
            if ! echo "$ENTITLEMENTS" | grep -q "<key>$key</key>"; then
              echo "Error: required entitlement missing: $key"
              exit 1
            fi
          done

      - name: Upload macOS installable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-smoke-macos-${{ matrix.arch }}
          path: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}

  build-windows-electron:
    if: ${{ inputs.build_windows }}
    name: Build Windows Electron (${{ matrix.arch }})
    # Match the production release workflow. windows-latest currently resolves
    # to a runner with Visual Studio 18, which this Electron/node-gyp stack does
    # not detect correctly.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Prepare SuperWeb for the target architecture
        shell: pwsh
        env:
          npm_config_cpu: ${{ matrix.arch }}
          npm_config_os: win32
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location packages/web/server/builtin-skills/skills/superweb
          try {
            npm ci --omit=dev --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'SuperWeb dependency installation failed' }
          } finally { Pop-Location }
          Push-Location packages/electron
          try {
            bun run prepare:superweb
            if ($LASTEXITCODE -ne 0) { throw 'SuperWeb staging failed' }
          } finally { Pop-Location }

      - name: Setup the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Resolve the knowledge backend source pin
        id: knowledge_source
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import knowledgePins from './packages/electron/scripts/embedded-knowledge-pin.cjs';
          const pin = knowledgePins.knowledgeSourcePin(process.env);
          const tags = process.env.OPENCHAMBER_EMBEDDED_KNOWLEDGE_TAGS || 'sqlite_fts5,anydoc';
          for (const field of ['repository', 'ref', 'commit']) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${field}=${pin[field]}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tags=${tags}\nsha256=${createHash('sha256').update(JSON.stringify({ ...pin, tags })).digest('hex')}\n`);
          NODE

      - name: Identify the memory backend overlay
        id: memory_overlay
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { memoryIndexOverlayDigest } from './packages/electron/scripts/embedded-knowledge-memory/apply.mjs';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${memoryIndexOverlayDigest()}\n`);
          NODE

      - name: Cache the pinned GNU toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/superwagie-winlibs
          key: superwagie-winlibs-x64-gcc16.2.0-ucrt-r2-d5dbafc4

      - name: Configure native Windows knowledge tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'superwagie-winlibs'
          $archive = Join-Path $toolRoot 'winlibs.zip'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          if (!(Test-Path $archive)) {
            Invoke-WebRequest 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.zip' -OutFile $archive
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd5dbafc4a170e762ca6143151ec918fb9e2c72736fb14cd704abebc6bdd5276a') {
            throw 'The pinned GNU toolchain checksum does not match'
          }
          & 7z x $archive "-o$toolRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GNU toolchain extraction failed' }
          $compiler = Join-Path $toolRoot 'mingw64/bin'
          $cc = (Join-Path $compiler 'x86_64-w64-mingw32-gcc.exe').Replace('\', '/')
          $cxx = (Join-Path $compiler 'x86_64-w64-mingw32-g++.exe').Replace('\', '/')
          if (!(Test-Path $cc) -or !(Test-Path $cxx)) { throw 'Pinned GNU compilers are missing' }
          $compiler | Add-Content $env:GITHUB_PATH
          "CC=$cc" | Add-Content $env:GITHUB_ENV
          "CXX=$cxx" | Add-Content $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$cc" | Add-Content $env:GITHUB_ENV
          'CGO_ENABLED=1' | Add-Content $env:GITHUB_ENV
          'GOFLAGS=-p=2' | Add-Content $env:GITHUB_ENV
          'CARGO_BUILD_JOBS=2' | Add-Content $env:GITHUB_ENV
          'RUSTUP_TOOLCHAIN=1.97.1' | Add-Content $env:GITHUB_ENV
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust GNU toolchain installation failed' }
          go mod download github.com/mattn/go-sqlite3@v1.14.24
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SQLite headers download failed' }
          $moduleCache = (go env GOMODCACHE).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Go module cache lookup failed' }
          $sqliteSource = Join-Path $moduleCache 'github.com/mattn/go-sqlite3@v1.14.24'
          $include = Join-Path $env:RUNNER_TEMP 'superwagie-sqlite-include'
          New-Item -ItemType Directory -Path $include -Force | Out-Null
          Copy-Item (Join-Path $sqliteSource 'sqlite3-binding.h') (Join-Path $include 'sqlite3.h') -Force
          Copy-Item (Join-Path $sqliteSource 'sqlite3ext.h') (Join-Path $include 'sqlite3ext.h') -Force
          ('CGO_CFLAGS=-I' + $include.Replace('\', '/')) | Add-Content $env:GITHUB_ENV

      - name: Cache source-built knowledge backend
        id: memory_backend_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/electron/.cache/embedded-knowledge
            packages/electron/resources/embedded-knowledge
            ~/.cargo/registry
            ~/.cargo/git
            ~/go/pkg/mod
          key: memory-backend-windows-x64-${{ steps.knowledge_source.outputs.sha256 }}-go1.26.5-rust1.97.1-${{ steps.memory_overlay.outputs.sha256 }}-${{ hashFiles('packages/electron/scripts/embedded-knowledge-windows-gnu.patch') }}

      - name: Prepare the current Windows knowledge backend
        working-directory: packages/electron
        shell: pwsh
        env:
          OPENCHAMBER_TARGET_ARCH: x64
          OPENCHAMBER_EMBEDDED_KNOWLEDGE_REPO: ${{ steps.knowledge_source.outputs.repository }}
          OPENCHAMBER_EMBEDDED_KNOWLEDGE_REF: ${{ steps.knowledge_source.outputs.ref }}
          OPENCHAMBER_EMBEDDED_KNOWLEDGE_COMMIT: ${{ steps.knowledge_source.outputs.commit }}
          OPENCHAMBER_EMBEDDED_KNOWLEDGE_TAGS: ${{ steps.knowledge_source.outputs.tags }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $PWD '.cache/embedded-knowledge/src'
          if (!(Test-Path (Join-Path $source '.git'))) {
            New-Item -ItemType Directory -Path $source -Force | Out-Null
            git init --quiet $source
            if ($LASTEXITCODE -ne 0) { throw 'Backend source initialization failed' }
            git -C $source config core.autocrlf false
            git -C $source fetch --depth=1 $env:OPENCHAMBER_EMBEDDED_KNOWLEDGE_REPO $env:OPENCHAMBER_EMBEDDED_KNOWLEDGE_COMMIT
            if ($LASTEXITCODE -ne 0) { throw 'Pinned backend source fetch failed' }
            git -C $source checkout --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Pinned backend checkout failed' }
          }
          $sourceCommit = (git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -ne $env:OPENCHAMBER_EMBEDDED_KNOWLEDGE_COMMIT) {
            throw 'Cached backend source does not match the pinned commit'
          }
          bun run prepare:embedded-knowledge
          if ($LASTEXITCODE -ne 0) { throw 'Current memory backend preparation failed' }

      - name: Save the validated knowledge backend
        if: steps.memory_backend_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/electron/.cache/embedded-knowledge
            packages/electron/resources/embedded-knowledge
            ~/.cargo/registry
            ~/.cargo/git
            ~/go/pkg/mod
          key: ${{ steps.memory_backend_cache.outputs.cache-primary-key }}

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        # npmRebuild=false in package.json, so electron-builder won't
        # recompile native deps on its own. Rebuild against the target
        # Electron ABI before packaging, matching the release workflow.
        run: node ./scripts/rebuild-native.mjs

      - name: Prepare native Hy resources
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bun run prepare:hy-memory -- --target=win32-${{ matrix.arch }}
          node --input-type=module -e "import { verifyHyMemoryResources } from './scripts/prepare-hy-memory.mjs'; verifyHyMemoryResources('resources/hy-memory', { target: 'win32-' + process.env.OPENCHAMBER_TARGET_ARCH });"

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        env:
          # verify:opencode-cli:packaged checks the CLI against the target arch.
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bun run prepare:presentation
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
          node ./scripts/windows-update-feeds.mjs ./dist

      - name: Upload Windows installable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-smoke-windows-${{ matrix.arch }}
          path: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
            packages/electron/dist/latest.yml
            packages/electron/dist/latest-x64.yml
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}

  build-linux-electron:
    if: ${{ inputs.build_linux }}
    name: Build Linux Electron (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            arch: x64
            host_arch: x86_64
            artifact_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
            manifest: latest-linux.yml
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            arch: arm64
            host_arch: aarch64
            artifact_arch: arm64
            deb_arch: arm64
            rpm_arch: aarch64
            manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify native Linux architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$OPENCHAMBER_TARGET_ARCH"

      - name: Set up Go for the knowledge backend
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'

      - name: Set up Rust for the knowledge backend
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.97.1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install rpmbuild for the .rpm package
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Get build versions
        id: versions
        shell: bash
        run: |
          echo "opencode_cli=$(node -p "require('./packages/electron/package.json').opencodeCli.version")" >> "$GITHUB_OUTPUT"
          echo "app=$(node -p "require('./packages/electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.versions.outputs.opencode_cli }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Prepare native Hy resources
        working-directory: packages/electron
        shell: bash
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bun run prepare:hy-memory -- --target=linux-${{ matrix.arch }}
          node --input-type=module -e "import { verifyHyMemoryResources } from './scripts/prepare-hy-memory.mjs'; verifyHyMemoryResources('resources/hy-memory', { target: 'linux-' + process.env.OPENCHAMBER_TARGET_ARCH });"

      - name: Build and package Linux AppImage, .deb and .rpm
        working-directory: packages/electron
        env:
          OPENCHAMBER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          bun run prepare:embedded-knowledge
          bun run bundle:main
          bun run rebuild:native
          bun run prepare:presentation
          node ./scripts/package.mjs --linux --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-appimage

      - name: Validate Linux update manifest
        working-directory: packages/electron
        env:
          VERSION: ${{ steps.versions.outputs.app }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$VERSION" \
            "dist/OpenChamber-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage" \
            "dist/OpenChamber-${VERSION}-linux-${DEB_ARCH}.deb" \
            "dist/OpenChamber-${VERSION}-linux-${RPM_ARCH}.rpm"

      - name: Upload Linux installable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-smoke-linux-${{ matrix.arch }}
          path: |
            packages/electron/dist/OpenChamber-${{ steps.versions.outputs.app }}-linux-${{ matrix.artifact_arch }}.AppImage
