name: Publish macOS asset (temporary)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to package
        required: true
        type: string
      release_tag:
        description: Existing draft release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check SuperWagie customizations
        run: bun run test:customizations

      - name: Build macOS arm64 package
        working-directory: packages/electron
        env:
          ELECTRON_BUILDER_ARCH: arm64
        run: |
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          bun run prepare:embedded-knowledge
          bun run bundle:main
          bun run rebuild:native
          ./node_modules/.bin/electron-builder --mac --arm64 --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload macOS assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        working-directory: packages/electron
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/SuperWagie-${RELEASE_TAG#v}-mac-arm64.dmg \
            dist/SuperWagie-${RELEASE_TAG#v}-mac-arm64.dmg.blockmap \
            dist/SuperWagie-${RELEASE_TAG#v}-mac-arm64.zip \
            dist/SuperWagie-${RELEASE_TAG#v}-mac-arm64.zip.blockmap \
            --repo "$GITHUB_REPOSITORY" --clobber
