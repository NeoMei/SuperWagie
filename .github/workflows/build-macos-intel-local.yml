name: Build macOS Intel local installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full source commit of the Intel local compatibility candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-intel-local:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      OPENCHAMBER_TARGET_ARCH: x64
      ELECTRON_BUILDER_ARCH: x64
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CGO_ENABLED: '1'
      CGO_CFLAGS: '-mmacosx-version-min=12.0 -Wno-deprecated-declarations'
      CGO_LDFLAGS: '-mmacosx-version-min=12.0 -Wl,-no_warn_duplicate_libraries'
      TARGET: x86_64-apple-darwin
      GOFLAGS: '-p=2'
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.97.1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require a frozen source commit
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(uname -m)" = x86_64

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Validate the local compatibility candidate
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('packages/electron/package.json', 'utf8'));
          assert.equal(process.platform, 'darwin');
          assert.equal(process.arch, 'x64');
          assert.equal(pkg.version, '2.7.40-intel');
          assert.equal(pkg.devDependencies.electron, '43.8.4');
          assert.equal(pkg.build.mac.minimumSystemVersion, '12.0');
          assert.notEqual(pkg.build.extraMetadata?.superwagieClientMode, 'remote-client');
          assert(!pkg.build.extraResources.some(resource => resource.to === 'desktop-mode.json'));
          NODE

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check SuperWagie customizations
        run: bun run test:customizations

      - name: Exercise platform journal crash recovery
        working-directory: packages/web
        run: bunx vitest run server/lib/platform-model/store.test.js server/lib/platform-model/runtime.test.js server/lib/platform-model/routes.test.js server/lib/opencode/managed-config-file.test.js

      - name: Verify the native Electron runtime and SQLite guard API
        working-directory: packages/electron
        run: |
          set -euo pipefail
          ELECTRON_BINARY=$(node -p "require('electron')")
          ELECTRON_RUN_AS_NODE=1 "$ELECTRON_BINARY" --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { DatabaseSync } from 'node:sqlite';
          assert.equal(process.arch, 'x64');
          assert.equal(process.versions.electron, '43.8.4');
          assert.equal(process.versions.modules, '148');
          const database = new DatabaseSync(':memory:');
          database.exec('BEGIN EXCLUSIVE; ROLLBACK');
          database.close();
          console.log(JSON.stringify({ electron: process.versions.electron, node: process.versions.node, abi: process.versions.modules, architecture: process.arch, sqlite: true }));
          NODE

      - name: Exercise the Electron 43 native clipboard API
        working-directory: packages/electron
        run: ./node_modules/.bin/electron ./scripts/smoke-context-menu.mjs --clipboard-only

      - name: Verify local packaging contracts
        run: node --test packages/electron/scripts/packaged-app-contents.test.cjs scripts/release-workflow.test.mjs

      - name: Prepare the macOS 12 local OpenCode engine and ripgrep
        working-directory: packages/electron
        run: |
          set -euo pipefail
          node ./scripts/prepare-intel-opencode.mjs
          bun run prepare:ripgrep

      - name: Prepare Intel SuperWeb
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts --prefix packages/web/server/builtin-skills/skills/superweb
          bun run --cwd packages/electron prepare:superweb

      - name: Setup the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Setup the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-apple-darwin
          rustc --version
          go version

      - name: Identify the memory backend overlay
        id: memory_overlay
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { memoryIndexOverlayDigest } from './packages/electron/scripts/embedded-knowledge-memory/apply.mjs';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${memoryIndexOverlayDigest()}\n`);
          NODE

      - name: Cache the macOS 12 Intel knowledge backend
        id: memory_backend_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/electron/.cache/embedded-knowledge
            packages/electron/resources/embedded-knowledge
            ~/.cargo/registry
            ~/.cargo/git
            ~/go/pkg/mod
          key: memory-backend-darwin-x64-macos12-f5adb9e-go1.26.5-rust1.97.1-${{ steps.memory_overlay.outputs.sha256 }}-${{ hashFiles('packages/electron/scripts/prepare-embedded-knowledge.mjs', 'packages/electron/scripts/embedded-knowledge-windows.mjs') }}

      - name: Prepare the current Intel knowledge backend
        working-directory: packages/electron
        env:
          OPENCHAMBER_EMBEDDED_KNOWLEDGE_COMMIT: f5adb9eac166e7d3da7dceed7aa50049d4c4db1f
        run: |
          set -euo pipefail
          source_dir=.cache/embedded-knowledge/src
          if [ ! -d "$source_dir/.git" ]; then
            mkdir -p "$source_dir"
            git init --quiet "$source_dir"
            git -C "$source_dir" fetch --depth=1 https://github.com/NeoMei/embedded-knowledge "$OPENCHAMBER_EMBEDDED_KNOWLEDGE_COMMIT"
            git -C "$source_dir" checkout --detach FETCH_HEAD
          fi
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$OPENCHAMBER_EMBEDDED_KNOWLEDGE_COMMIT"
          bun run prepare:embedded-knowledge
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const binary = 'resources/embedded-knowledge/embedded-knowledge-server';
          const architecture = execFileSync('lipo', ['-archs', binary], { encoding: 'utf8' }).trim();
          assert.equal(architecture, 'x86_64');
          const commands = execFileSync('otool', ['-l', binary], { encoding: 'utf8' });
          const minima = [...commands.matchAll(/cmd LC_BUILD_VERSION\s+[\s\S]*?\bminos (\d+)(?:\.(\d+))?/g), ...commands.matchAll(/cmd LC_VERSION_MIN_MACOSX\s+[\s\S]*?\bversion (\d+)(?:\.(\d+))?/g)];
          assert(minima.length > 0, 'Knowledge backend has no macOS deployment version');
          for (const minimum of minima) assert(Number(minimum[1]) < 12 || (Number(minimum[1]) === 12 && Number(minimum[2] || 0) === 0), `Knowledge backend requires macOS ${minimum[1]}.${minimum[2] || 0}`);
          NODE

      - name: Save the macOS 12 Intel knowledge backend
        if: steps.memory_backend_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/electron/.cache/embedded-knowledge
            packages/electron/resources/embedded-knowledge
            ~/.cargo/registry
            ~/.cargo/git
            ~/go/pkg/mod
          key: ${{ steps.memory_backend_cache.outputs.cache-primary-key }}

      - name: Cache locked Intel memory runtime archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/electron/.cache/hy-memory
          key: hy-memory-darwin-x64-${{ hashFiles('packages/electron/scripts/hy-memory-runtime.lock.json') }}

      - name: Prepare the native Intel memory runtime
        working-directory: packages/electron
        run: bun run prepare:hy-memory

      - name: Exercise native memory with the shared backend
        timeout-minutes: 4
        run: |
          set -euo pipefail
          backend="$PWD/packages/electron/resources/embedded-knowledge/embedded-knowledge-server"
          backend_root="$PWD/packages/electron/resources/embedded-knowledge"
          python="$PWD/packages/electron/resources/hy-memory/runtime/bin/python3"
          export OPENCHAMBER_HY_MEMORY_WORKER_SCRIPT="$PWD/packages/electron/resources/hy-memory/python/worker.py"
          "$python" -B -m unittest discover -s packages/web/server/lib/hy-memory/python/tests
          node packages/web/scripts/hy-memory-smoke.mjs "--backend=$backend" "--backend-root=$backend_root" "--python=$python"
          node packages/web/scripts/hy-memory-s2-smoke.mjs "--backend=$backend" "--backend-root=$backend_root" "--python=$python"

      - name: Build the Intel UI and native modules
        working-directory: packages/electron
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run bundle:main
          bun run rebuild:native

      - name: Build the macOS 12 native speech module
        working-directory: packages/electron
        run: node ./scripts/prepare-intel-speech.mjs

      - name: Package the Intel local application
        id: package_app
        working-directory: packages/electron
        run: node ./scripts/package.mjs --mac --x64 --publish=never

      - name: Verify Intel local resources and macOS deployment versions
        run: node scripts/verify-intel-local.mjs --app=packages/electron/dist/mac/犇马.app --receipt=packages/electron/dist/intel-local-resources.json

      - name: Exercise the packaged local engine APIs and tools
        timeout-minutes: 5
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: node scripts/smoke-intel-engine.mjs --app=packages/electron/dist/mac/犇马.app --receipt=packages/electron/dist/intel-local-engine.json "--source=$SOURCE_COMMIT"

      - name: Exercise the packaged local backend and crash recovery
        timeout-minutes: 8
        run: node scripts/smoke-intel-local.mjs --app=packages/electron/dist/mac/犇马.app --receipt=packages/electron/dist/intel-local-startup.json

      - name: Verify the actual local DMG and ZIP payloads
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          dist="$PWD/packages/electron/dist"
          stage=$(mktemp -d "${TMPDIR%/}/superwagie-installer-XXXXXX")
          mounted=0
          cleanup() {
            if [ "$mounted" = 1 ]; then hdiutil detach "$stage/mount" -quiet; fi
            rm -rf "$stage"
          }
          trap cleanup EXIT
          ditto -x -k "$dist/SuperWagie-2.7.40-intel-mac-x64.zip" "$stage/zip"
          node scripts/verify-intel-local.mjs "--app=$stage/zip/犇马.app" "--receipt=$dist/intel-local-zip.json" "--ci-receipt=$dist/intel-local-resources.json" "--source=$SOURCE_COMMIT"
          mkdir "$stage/mount"
          hdiutil attach "$dist/SuperWagie-2.7.40-intel-mac-x64.dmg" -readonly -nobrowse -mountpoint "$stage/mount" -quiet
          mounted=1
          node scripts/verify-intel-local.mjs "--app=$stage/mount/犇马.app" "--receipt=$dist/intel-local-dmg.json" "--ci-receipt=$dist/intel-local-resources.json" "--source=$SOURCE_COMMIT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const directory = 'packages/electron/dist';
          const source = process.env.SOURCE_COMMIT;
          const receipts = ['resources', 'engine', 'startup', 'zip', 'dmg'];
          for (const name of receipts) {
            const receipt = JSON.parse(fs.readFileSync(path.join(directory, `intel-local-${name}.json`)));
            assert.equal(receipt.passed, true, `${name} validation failed`);
            assert.equal(receipt.sourceCommit, source, `${name} source differs`);
          }
          const files = [];
          for (const extension of ['dmg', 'dmg.blockmap', 'zip', 'zip.blockmap']) {
            const name = `SuperWagie-2.7.40-intel-mac-x64.${extension}`;
            const file = path.join(directory, name);
            const hash = createHash('sha256');
            assert(fs.lstatSync(file).isFile());
            for await (const bytes of fs.createReadStream(file)) hash.update(bytes);
            files.push({ name, size: fs.statSync(file).size, sha256: hash.digest('hex') });
          }
          fs.writeFileSync(path.join(directory, 'intel-local-provenance.json'), JSON.stringify({
            schemaVersion: 1, sourceCommit: source, version: '2.7.40-intel',
            runId: process.env.GITHUB_RUN_ID, passed: true,
            localRuntimeVerified: true, installersUnchanged: true, files,
          }, null, 2) + '\n');
          NODE

      - name: Upload Intel local installers
        if: always() && steps.package_app.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-intel-local
          path: |
            packages/electron/dist/SuperWagie-2.7.40-intel-mac-x64.dmg
            packages/electron/dist/SuperWagie-2.7.40-intel-mac-x64.dmg.blockmap
            packages/electron/dist/SuperWagie-2.7.40-intel-mac-x64.zip
            packages/electron/dist/SuperWagie-2.7.40-intel-mac-x64.zip.blockmap
            packages/electron/dist/intel-local-resources.json
            packages/electron/dist/intel-local-engine.json
            packages/electron/dist/intel-local-startup.json
            packages/electron/dist/intel-local-zip.json
            packages/electron/dist/intel-local-dmg.json
            packages/electron/dist/intel-local-provenance.json
            packages/electron/dist/intel-speech.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Intel local diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-intel-local-diagnostics
          path: |
            packages/electron/dist/intel-local-*.json
            packages/electron/dist/intel-local-*.json.log
            packages/electron/dist/intel-speech.json
          if-no-files-found: ignore
          retention-days: 7
