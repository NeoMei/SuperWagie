name: pr checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR makes the older run pointless.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each check runs on a GitHub-hosted Ubuntu runner. The jobs are independent.
# The dependency install builds the SDK and the built-in extensions.
jobs:
  type-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run type-check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Changelog outputs match their sources
        run: bun run changelog:check

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Prepare browser and Python test prerequisites
        run: |
          google-chrome --version
          python3 -m venv "$RUNNER_TEMP/pr-test-python"
          "$RUNNER_TEMP/pr-test-python/bin/python3" -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'
          echo "$RUNNER_TEMP/pr-test-python/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Electron Linux packaging unit tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

  # Catches what type-check cannot: bundling, Vite-only syntax, the web
  # build's memory ceiling. The packages whose `build` is only a type-check (`tsc -b`)
  # (ui) or a no-op (electron) are covered by the type-check job.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web
        run: bun run --cwd packages/web build
      - name: Prepare mobile web assets
        run: bun run --cwd packages/mobile build:assets
