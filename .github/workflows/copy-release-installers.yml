name: Copy verified Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft version, for example 2.7.25
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate commit
        required: true
        type: string
      windows_run_id:
        description: Successful Windows build workflow run ID
        required: true
        type: string
      win_exe_sha256:
        description: Verified Windows x64 EXE SHA-256
        required: true
        type: string

permissions: {}

jobs:
  copy-windows-installer:
    if: github.repository == 'NeoMei/SuperWagie'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    concurrency:
      group: copy-windows-installer-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Verify CI artifact and copy into the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          WIN_EXE_SHA256: ${{ inputs.win_exe_sha256 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import ssl
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request

          REPOSITORY = 'NeoMei/SuperWagie'
          API = f'https://api.github.com/repos/{REPOSITORY}'
          UPLOADS = f'https://uploads.github.com/repos/{REPOSITORY}'
          if os.environ.get('GITHUB_REPOSITORY') != REPOSITORY:
              raise RuntimeError('This workflow only supports the SuperWagie repository')
          version = os.environ['VERSION']
          candidate = os.environ['CANDIDATE_SHA']
          run_id = os.environ['WINDOWS_RUN_ID']
          expected = os.environ['WIN_EXE_SHA256']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise RuntimeError('Version must be an exact stable semantic version')
          if not re.fullmatch(r'[0-9a-f]{40}', candidate):
              raise RuntimeError('Candidate must be a lowercase 40-character commit SHA')
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise RuntimeError('Windows run ID must be a positive integer')
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise RuntimeError('Installer requires a lowercase SHA-256')
          token = os.environ.pop('GH_TOKEN')
          if not token:
              raise RuntimeError('GitHub token is required')
          name = f'SuperWagie-{version}-win-x64.exe'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}), NoRedirect(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'SuperWagie-release-copy',
          }

          def api(endpoint):
              with opener.open(urllib.request.Request(API + endpoint, headers=headers), timeout=120) as response:
                  return json.load(response)

          def pages(endpoint):
              page = 1
              while True:
                  batch = api(f'{endpoint}?per_page=100&page={page}')
                  if not isinstance(batch, list):
                      raise RuntimeError('Unexpected GitHub list response')
                  yield from batch
                  if len(batch) < 100:
                      return
                  page += 1

          run = api(f'/actions/runs/{run_id}')
          if (run.get('id') != int(run_id) or run.get('head_sha') != candidate
                  or run.get('status') != 'completed' or run.get('conclusion') != 'success'
                  or run.get('path') != '.github/workflows/windows-build.yml'
                  or run.get('head_repository', {}).get('full_name') != REPOSITORY
                  or run.get('event') != 'workflow_dispatch'):
              raise RuntimeError('Windows workflow run does not match the successful candidate build')

          def check_release(release):
              if (release.get('draft') is not True or release.get('tag_name') != f'v{version}'
                      or release.get('target_commitish') != candidate):
                  raise RuntimeError('Release must remain a draft targeting the exact candidate SHA')
              release_id = release.get('id')
              if type(release_id) is not int or release_id <= 0:
                  raise RuntimeError('Invalid release identity')
              return release_id

          matches = [release for release in pages('/releases') if release.get('tag_name') == f'v{version}']
          if len(matches) != 1:
              raise RuntimeError('Exactly one existing release must match the version')
          release_id = check_release(matches[0])

          def existing_asset():
              matches = [asset for asset in pages(f'/releases/{release_id}/assets') if asset.get('name') == name]
              if len(matches) > 1:
                  raise RuntimeError('Duplicate installer asset')
              return matches[0] if matches else None

          def check_asset(asset, size):
              if (not asset or asset.get('name') != name or asset.get('state') != 'uploaded'
                      or asset.get('size') != size or asset.get('digest') != f'sha256:{expected}'):
                  raise RuntimeError('Existing or uploaded asset differs from verified installer bytes')

          with tempfile.TemporaryDirectory(prefix='superwagie-windows-copy-') as directory:
              # gh handles GitHub's signed artifact download URL. The token stays in process memory.
              try:
                  subprocess.run(
                      ['gh', 'run', 'download', run_id, '-R', REPOSITORY, '-n', 'windows-x64', '-D', directory],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
                      env={**os.environ, 'GH_TOKEN': token, 'GH_HOST': 'github.com'},
                  )
              except subprocess.CalledProcessError:
                  raise RuntimeError('CI artifact download failed') from None
              installer = pathlib.Path(directory, name)
              if installer.is_symlink() or not installer.is_file():
                  raise RuntimeError('Exact Windows x64 installer is missing from the artifact')
              digest = hashlib.sha256()
              size = 0
              with installer.open('rb') as source:
                  while chunk := source.read(1024 * 1024):
                      digest.update(chunk)
                      size += len(chunk)
              if size == 0 or digest.hexdigest() != expected:
                  raise RuntimeError('CI installer SHA-256 mismatch')
              print(f'Verified {name}: {size} bytes, sha256:{expected}', flush=True)
              if check_release(api(f'/releases/{release_id}')) != release_id:
                  raise RuntimeError('Release identity changed')
              asset = existing_asset()
              if asset:
                  check_asset(asset, size)
                  print('Installer already present with matching bytes', flush=True)
              else:
                  with installer.open('rb') as body:
                      request = urllib.request.Request(
                          f'{UPLOADS}/releases/{release_id}/assets?{urllib.parse.urlencode({"name": name})}',
                          data=body, method='POST',
                          headers={**headers, 'Content-Type': 'application/octet-stream', 'Content-Length': str(size)},
                      )
                      try:
                          with opener.open(request, timeout=900) as response:
                              uploaded = json.load(response)
                      except urllib.error.HTTPError as error:
                          conflict = error.code == 409
                          if error.code == 422:
                              detail = json.load(error)
                              conflict = any(item.get('code') == 'already_exists' for item in detail.get('errors', []))
                          if not conflict:
                              raise
                          uploaded = existing_asset()
                      check_asset(uploaded, size)
                  print('Installer present with verified bytes', flush=True)
              check_release(api(f'/releases/{release_id}'))
          PY
