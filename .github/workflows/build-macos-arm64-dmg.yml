name: SuperWagie macOS ARM64 candidate runtime smoke
run-name: SuperWagie 2.7.121 native ARM64 smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact application source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      OPENCHAMBER_TARGET_ARCH: arm64
      ELECTRON_BUILDER_ARCH: arm64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      OPENCHAMBER_PRODUCT_HELP_UPDATES: '0'
      OPENCHAMBER_UPDATE_API_URL: 'http://127.0.0.1:1'
      OPENCHAMBER_E2E: '1'
      OPENCHAMBER_UPDATER_E2E_URL: 'http://127.0.0.1:1/latest.json'
      OPENCHAMBER_UNIHUB_PRODUCT_MODEL_PROXY_URL: 'https://qa-model-proxy.invalid'
      GOFLAGS: '-p=2'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require the frozen ARM64 candidate
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          test "$SOURCE_COMMIT" = 106683b884902fbee1eb994791fdeb541ae47925
          test "$(uname -m)" = arm64

      - name: Checkout the exact application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record the source tree and runner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 106683b884902fbee1eb994791fdeb541ae47925
          test "$(git rev-parse HEAD^{tree})" = 93616ee6aa480a8b6993606736dbc3b8ea94ee86
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/native-receipts"
          jq -n --arg sourceCommit "$(git rev-parse HEAD)" --arg sourceTree "$(git rev-parse HEAD^{tree})" \
            --arg macOS "$(sw_vers -productVersion)" --arg architecture "$(uname -m)" \
            '{sourceCommit:$sourceCommit,sourceTree:$sourceTree,macOS:$macOS,architecture:$architecture,signing:"ad-hoc",distribution:false}' \
            > "$RUNNER_TEMP/native-receipts/source.json"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.97.1'
          targets: aarch64-apple-darwin

      - name: Install dependencies and check SuperWagie customizations
        run: |
          bun install --frozen-lockfile
          bun run test:customizations

      - name: Stage resources and package the ad-hoc app
        working-directory: packages/electron
        run: |
          bun run package --mac --arm64 --adhoc --dir --publish=never
          bun run verify:opencode-cli:packaged

      - name: Verify and exercise the native application
        timeout-minutes: 10
        run: |
          set -euo pipefail
          app="$PWD/packages/electron/dist/mac-arm64/犇马.app"
          test -d "$app"
          executable="$app/Contents/MacOS/犇马"
          test "$(lipo -archs "$executable")" = arm64
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep '^Signature=adhoc$'
          jq -n --arg mainSHA256 "$(shasum -a 256 "$executable" | cut -d ' ' -f 1)" \
            --arg asarSHA256 "$(shasum -a 256 "$app/Contents/Resources/app.asar" | cut -d ' ' -f 1)" \
            '{architecture:"arm64",signatureVerified:true,mainSHA256:$mainSHA256,asarSHA256:$asarSHA256}' \
            > "$RUNNER_TEMP/native-receipts/app.json"
          node packages/electron/scripts/smoke-packaged-runtime.mjs --app "$app" --receipt "$RUNNER_TEMP/native-receipts/runtime.json"
          jq -e '.passed and .nativeQuit and .backendPortClosed and .existingSessionAndSyntheticHistoryRead and (.paidModelRequests == 0)' \
            "$RUNNER_TEMP/native-receipts/runtime.json"

      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: superwagie-2.7.121-macos-arm64-native-receipts
          path: ${{ runner.temp }}/native-receipts/*.json
          if-no-files-found: error
          retention-days: 7
