name: Publish macOS 2.7.35 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v2.7.35

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check SuperWagie customizations
        run: bun run test:customizations

      - name: Restore the last verified bundled resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified-resources"
          gh release download v2.7.34 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SuperWagie-2.7.32-mac-arm64.zip' \
            --dir "$RUNNER_TEMP/verified-resources"
          ditto -x -k "$RUNNER_TEMP/verified-resources/SuperWagie-2.7.32-mac-arm64.zip" "$RUNNER_TEMP/verified-resources/unpacked"
          app=$(find "$RUNNER_TEMP/verified-resources/unpacked" -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app"
          cp -R "$app/Contents/Resources/embedded-knowledge" packages/electron/resources/
          cp -R "$app/Contents/Resources/superweb" packages/electron/resources/
          test -x packages/electron/resources/embedded-knowledge/embedded-knowledge-server
          test -f packages/electron/resources/embedded-knowledge/manifest.json
          test -f packages/electron/resources/superweb/SKILL.md

      - name: Build macOS arm64 package
        working-directory: packages/electron
        env:
          ELECTRON_BUILDER_ARCH: arm64
        run: |
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          bun run bundle:main
          bun run rebuild:native
          ./node_modules/.bin/electron-builder --mac --arm64 --publish=never
          bun run verify:opencode-cli:packaged
          app=$(find dist/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          test -x "$app/Contents/Resources/embedded-knowledge/embedded-knowledge-server"
          test -f "$app/Contents/Resources/embedded-knowledge/manifest.json"
          test -f "$app/Contents/Resources/superweb/SKILL.md"

      - name: Upload macOS assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: packages/electron
        run: |
          set -euo pipefail
          gh release upload v2.7.35 \
            dist/SuperWagie-2.7.35-mac-arm64.dmg \
            dist/SuperWagie-2.7.35-mac-arm64.dmg.blockmap \
            dist/SuperWagie-2.7.35-mac-arm64.zip \
            dist/SuperWagie-2.7.35-mac-arm64.zip.blockmap \
            --repo "$GITHUB_REPOSITORY" --clobber
