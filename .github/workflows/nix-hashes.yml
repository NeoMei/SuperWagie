# Keeps the flake's baked dependency hashes in step with the two files that
# decide them: bun.lock (the bun-deps fixed-output derivation) and
# packages/electron/package.json (the pinned OpenCode CLI tag). When either
# moves on main, the flake fails to evaluate until the tag and hashes are
# re-baked; this workflow runs the same `nix run .#update-hashes` a
# contributor would run and opens a PR with the result.
name: nix-hashes

on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - packages/electron/package.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-hashes
  cancel-in-progress: false

jobs:
  rehash:
    runs-on: ubuntu-latest
    steps:
      # No persisted GITHUB_TOKEN: the only push here goes through the app
      # token below, and a token left in git config would win and get a 403.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # A local substituter backed by the Actions cache: the first run builds
      # the fixed-output derivations and pushes them; later runs substitute
      # in minutes instead of re-downloading the world.
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
      # The bake runs without any token; it only needs the network.
      - name: Re-bake dependency hashes
        id: bake
        run: |
          nix run .#update-hashes
          if git diff --quiet; then
            echo "hashes already current, nothing to bake"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and retain the exact dependency pins
        run: |
          nix eval --raw .#openchamber.drvPath
          nix eval --raw .#openchamber-desktop.drvPath
          nix eval --raw .#opencode-cli.drvPath
          nix flake check --no-build
          git diff --check
          git diff --binary -- flake.nix flake.lock nix/hashes.json > "${RUNNER_TEMP}/nix-release.patch"
          test -s "${RUNNER_TEMP}/nix-release.patch"
      - name: Upload verified pins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nix-release-pins
          path: ${{ runner.temp }}/nix-release.patch
          if-no-files-found: error
