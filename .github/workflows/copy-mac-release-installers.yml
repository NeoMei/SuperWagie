name: Copy verified Mac installers with ranges

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft version, for example 2.7.25
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate commit
        required: true
        type: string
      mac_dmg_sha256:
        description: Verified macOS arm64 DMG SHA-256
        required: true
        type: string
      mac_zip_sha256:
        description: Verified macOS arm64 ZIP SHA-256
        required: true
        type: string
      mac_dmg_bytes:
        description: Verified DMG byte size
        required: true
        type: string
      mac_zip_bytes:
        description: Verified ZIP byte size
        required: true
        type: string

permissions: {}

jobs:
  copy-mac-installers:
    if: github.repository == 'NeoMei/SuperWagie-Open'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: copy-mac-installers-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Verify ranged origin bytes and copy into the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MAC_DMG_SHA256: ${{ inputs.mac_dmg_sha256 }}
          MAC_ZIP_SHA256: ${{ inputs.mac_zip_sha256 }}
          MAC_DMG_BYTES: ${{ inputs.mac_dmg_bytes }}
          MAC_ZIP_BYTES: ${{ inputs.mac_zip_bytes }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import ssl
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor

          REPOSITORY = 'NeoMei/SuperWagie-Open'
          API = f'https://api.github.com/repos/{REPOSITORY}'
          UPLOADS = f'https://uploads.github.com/repos/{REPOSITORY}'
          ORIGIN = 'https://www.superwagie.com/downloads/'
          CHUNK_BYTES = 16 * 1024 * 1024
          if os.environ.get('GITHUB_REPOSITORY') != REPOSITORY:
              raise RuntimeError('This workflow only supports the SuperWagie repository')
          version = os.environ['VERSION']
          candidate = os.environ['CANDIDATE_SHA']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise RuntimeError('Version must be an exact stable semantic version')
          if not re.fullmatch(r'[0-9a-f]{40}', candidate):
              raise RuntimeError('Candidate must be a lowercase 40-character commit SHA')
          installers = []
          for extension, digest_key, size_key in [
              ('dmg', 'MAC_DMG_SHA256', 'MAC_DMG_BYTES'),
              ('zip', 'MAC_ZIP_SHA256', 'MAC_ZIP_BYTES'),
          ]:
              digest = os.environ[digest_key]
              size = os.environ[size_key]
              if not re.fullmatch(r'[0-9a-f]{64}', digest) or not re.fullmatch(r'[1-9][0-9]*', size):
                  raise RuntimeError('Each installer requires a lowercase SHA-256 and positive byte size')
              installers.append((f'SuperWagie-{version}-mac-arm64.{extension}', digest, int(size)))
          token = os.environ.pop('GH_TOKEN')
          if not token:
              raise RuntimeError('GitHub token is required')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          def make_opener():
              return urllib.request.build_opener(
                  urllib.request.ProxyHandler({}), NoRedirect(),
                  urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              )

          opener = make_opener()
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'SuperWagie-release-copy',
          }

          def api(endpoint):
              with opener.open(urllib.request.Request(API + endpoint, headers=headers), timeout=120) as response:
                  return json.load(response)

          def pages(endpoint):
              page = 1
              while True:
                  batch = api(f'{endpoint}?per_page=100&page={page}')
                  if not isinstance(batch, list):
                      raise RuntimeError('Unexpected GitHub list response')
                  yield from batch
                  if len(batch) < 100:
                      return
                  page += 1

          def check_release(release):
              if (release.get('draft') is not True or release.get('tag_name') != f'v{version}'
                      or release.get('target_commitish') != candidate):
                  raise RuntimeError('Release must remain a draft targeting the exact candidate SHA')
              release_id = release.get('id')
              if type(release_id) is not int or release_id <= 0:
                  raise RuntimeError('Invalid release identity')
              return release_id

          matches = [release for release in pages('/releases') if release.get('tag_name') == f'v{version}']
          if len(matches) != 1:
              raise RuntimeError('Exactly one existing release must match the version')
          release_id = check_release(matches[0])

          def existing_asset(name):
              matches = [asset for asset in pages(f'/releases/{release_id}/assets') if asset.get('name') == name]
              if len(matches) > 1:
                  raise RuntimeError(f'Duplicate release asset: {name}')
              return matches[0] if matches else None

          def check_asset(asset, name, size, digest):
              if (not asset or asset.get('name') != name or asset.get('state') != 'uploaded'
                      or asset.get('size') != size or asset.get('digest') != f'sha256:{digest}'):
                  raise RuntimeError(f'Existing or uploaded asset differs from verified bytes: {name}')

          def download_installer(item, directory):
              name, expected, size = item
              url = ORIGIN + name
              # Origin requests carry only download headers, never GitHub credentials.
              request = urllib.request.Request(url, method='HEAD', headers={'Accept-Encoding': 'identity'})
              with make_opener().open(request, timeout=120) as response:
                  if response.status != 200 or response.headers.get('Content-Length') != str(size):
                      raise RuntimeError(f'Origin size mismatch: {name}')
              ranges = [(start, min(start + CHUNK_BYTES, size) - 1) for start in range(0, size, CHUNK_BYTES)]

              def download_range(bounds):
                  start, end = bounds
                  fragment = pathlib.Path(directory, f'{name}.{start}.part')
                  request = urllib.request.Request(url, headers={
                      'Range': f'bytes={start}-{end}', 'Accept-Encoding': 'identity',
                  })
                  length = end - start + 1
                  received = 0
                  with make_opener().open(request, timeout=120) as response, fragment.open('wb') as output:
                      if (response.status != 206
                              or response.headers.get('Content-Range') != f'bytes {start}-{end}/{size}'
                              or response.headers.get('Content-Length') != str(length)
                              or response.headers.get('Content-Encoding', 'identity') != 'identity'):
                          raise RuntimeError(f'Invalid origin range response: {name} bytes={start}-{end}')
                      while chunk := response.read(1024 * 1024):
                          received += len(chunk)
                          if received > length:
                              raise RuntimeError(f'Oversized origin range: {name}')
                          output.write(chunk)
                  if received != length:
                      raise RuntimeError(f'Incomplete origin range: {name} bytes={start}-{end}')
                  print(f'Downloaded {name} bytes={start}-{end}', flush=True)
                  return fragment

              with ThreadPoolExecutor(max_workers=8) as executor:
                  fragments = list(executor.map(download_range, ranges))
              destination = pathlib.Path(directory, name)
              digest = hashlib.sha256()
              assembled = 0
              with destination.open('wb') as output:
                  for fragment in fragments:
                      with fragment.open('rb') as source:
                          while chunk := source.read(1024 * 1024):
                              output.write(chunk)
                              digest.update(chunk)
                              assembled += len(chunk)
                      fragment.unlink()
              if assembled != size or digest.hexdigest() != expected:
                  raise RuntimeError(f'Origin SHA-256 mismatch: {name}')
              print(f'Verified {name}: {size} bytes, sha256:{expected}', flush=True)
              return name, destination, size, expected

          with tempfile.TemporaryDirectory(prefix='superwagie-mac-copy-') as directory:
              verified = [download_installer(item, directory) for item in installers]
              # Both full-file hashes and existing assets must pass before the first POST.
              for name, _, size, digest in verified:
                  asset = existing_asset(name)
                  if asset:
                      check_asset(asset, name, size, digest)
              for name, destination, size, digest in verified:
                  if check_release(api(f'/releases/{release_id}')) != release_id:
                      raise RuntimeError('Release identity changed')
                  asset = existing_asset(name)
                  if asset:
                      check_asset(asset, name, size, digest)
                      print(f'Already present with matching bytes: {name}', flush=True)
                      continue
                  with destination.open('rb') as body:
                      request = urllib.request.Request(
                          f'{UPLOADS}/releases/{release_id}/assets?{urllib.parse.urlencode({"name": name})}',
                          data=body, method='POST',
                          headers={**headers, 'Content-Type': 'application/octet-stream', 'Content-Length': str(size)},
                      )
                      try:
                          with opener.open(request, timeout=900) as response:
                              uploaded = json.load(response)
                      except urllib.error.HTTPError as error:
                          conflict = error.code == 409
                          if error.code == 422:
                              detail = json.load(error)
                              conflict = any(item.get('code') == 'already_exists' for item in detail.get('errors', []))
                          if not conflict:
                              raise
                          uploaded = existing_asset(name)
                      check_asset(uploaded, name, size, digest)
                  print(f'Present with verified bytes: {name}', flush=True)
              check_release(api(f'/releases/{release_id}'))
          PY
