<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1735" cy="130" r="280" fill="#dff3ef" opacity="0.8"/>
  <circle cx="120" cy="1000" r="250" fill="#e5e9ff" opacity="0.72"/>

  <text x="150" y="126" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" letter-spacing="5" fill="#607181">SUPERWAGIE · DELIVERY PIPELINE</text>
  <text x="150" y="236" font-family="Arial, PingFang SC, sans-serif" font-size="72" font-weight="700" fill="#17324d">内容整理到交付</text>
  <text x="150" y="302" font-family="Arial, PingFang SC, sans-serif" font-size="30" fill="#607181">以 Markdown 为内容基线，经 Agent 引导加工，生成可审阅的交付物</text>

  <g filter="url(#shadow)">
    <rect x="150" y="420" width="430" height="330" rx="34" fill="#ffffff" stroke="#b9c7ff" stroke-width="4"/>
    <rect x="745" y="420" width="430" height="330" rx="34" fill="#ffffff" stroke="#88d7ca" stroke-width="4"/>
    <rect x="1340" y="420" width="430" height="330" rx="34" fill="#ffffff" stroke="#c8d0d8" stroke-width="4"/>
  </g>

  <circle cx="240" cy="510" r="38" fill="#e8ebff"/>
  <text x="240" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#4457b8">01</text>
  <text x="210" y="610" font-family="Arial, PingFang SC, sans-serif" font-size="42" font-weight="700" fill="#17324d">Markdown 内容</text>
  <text x="210" y="670" font-family="Arial, PingFang SC, sans-serif" font-size="27" fill="#607181">文档 · 资料 · 目录</text>

  <circle cx="835" cy="510" r="38" fill="#ddf6f1"/>
  <text x="835" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#168677">02</text>
  <text x="805" y="610" font-family="Arial, PingFang SC, sans-serif" font-size="42" font-weight="700" fill="#17324d">Agent 引导加工</text>
  <text x="805" y="670" font-family="Arial, PingFang SC, sans-serif" font-size="27" fill="#607181">补充 · 确认 · 返工</text>

  <circle cx="1430" cy="510" r="38" fill="#eef1f4"/>
  <text x="1430" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#586878">03</text>
  <text x="1400" y="610" font-family="Arial, PingFang SC, sans-serif" font-size="42" font-weight="700" fill="#17324d">PPT / Word / HTML</text>
  <text x="1400" y="670" font-family="Arial, PingFang SC, sans-serif" font-size="27" fill="#607181">制作 · 审阅 · 发布</text>

  <path d="M610 585 H695" fill="none" stroke="#607181" stroke-width="7" stroke-linecap="round"/>
  <path d="M680 565 L710 585 L680 605" fill="none" stroke="#607181" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1205 585 H1290" fill="none" stroke="#607181" stroke-width="7" stroke-linecap="round"/>
  <path d="M1275 565 L1305 585 L1275 605" fill="none" stroke="#607181" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="150" y="886" width="1620" height="2" fill="#d4dde4"/>
  <text x="150" y="958" font-family="Arial, PingFang SC, sans-serif" font-size="25" fill="#607181">1920 × 1080 · deterministic high-resolution validation fixture</text>
  <text x="1770" y="958" text-anchor="end" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">SUPERWAGIE</text>
